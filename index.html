<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでピンチズームやダブルタップ拡大が起きないようにする -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- 古いバージョンがキャッシュから表示され続けないよう、index.html をキャッシュさせない指定 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>鏡射的</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #87a9c9;
      /* スマホでのスクロール・長押し選択・タップハイライトを無効化 */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: sans-serif;
    }
    /* ドラッグで視点を回すため、キャンバス上でもスクロール・ズームを無効化 */
    canvas { display: block; touch-action: none; }

    /* ===== バーチャルスティック（左下）。左右の移動だけに使う ===== */
    #stick {
      position: fixed;
      left: calc(24px + env(safe-area-inset-left));
      bottom: calc(24px + env(safe-area-inset-bottom));
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.5);
      touch-action: none;
    }
    #stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    /* ===== 射撃ボタン（右下） ===== */
    #shoot {
      position: fixed;
      right: calc(32px + env(safe-area-inset-right));
      bottom: calc(40px + env(safe-area-inset-bottom));
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 120, 90, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transition: opacity 0.1s;
    }
    #shoot.pressed { background: rgba(255, 120, 90, 0.6); }
    /* クールダウン中は薄く表示して、まだ撃てないことを伝える */
    #shoot.cooling { opacity: 0.45; }

    /* ===== 照準（＋マーク）。縦位置は JS で CROSSHAIR_RAISE から決める ===== */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      --crosshair-color: rgba(255, 255, 255, 0.9);
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: var(--crosshair-color);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.7);
    }
    #crosshair::before { left: -9px; top: -1px; width: 18px; height: 2px; } /* 横棒 */
    #crosshair::after  { left: -1px; top: -9px; width: 2px; height: 18px; } /* 縦棒 */
    /* 照準が風船に重なっているときは赤くする */
    #crosshair.on-target { --crosshair-color: #ff3030; }

    /* ===== 1本の矢で割った風船の数（「×3 HIT!」）を画面中央に表示 ===== */
    #hit-popup {
      position: fixed;
      left: 50%;
      top: 32%;
      transform: translate(-50%, -50%);
      color: #ffe14d;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow: 0 2px 0 #b34700, 0 0 10px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      display: none;
    }
    #hit-popup.show {
      display: block;
      animation: hit-pop 1s ease-out forwards;
    }
    /* ポンと大きく出て、最後にふわっと消える */
    @keyframes hit-pop {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      12%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      25%  { transform: translate(-50%, -50%) scale(1); }
      75%  { opacity: 1; }
      100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
    }

    /* 効果音のON/OFFボタン（右上、バージョン表示の下） */
    #sound {
      position: fixed;
      right: calc(8px + env(safe-area-inset-right));
      top: calc(26px + env(safe-area-inset-top));
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
    }

    /* バージョン表示（右上）：どのバージョンが読み込まれているか確認する用 */
    #version {
      position: fixed;
      right: calc(10px + env(safe-area-inset-right));
      top: calc(8px + env(safe-area-inset-top));
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    /* ===== 画面の状態ごとの表示切り替え =====
       body の data-state に今の状態（title / countdown / playing / result）を入れる */
    /* タイトルとリザルトでは、後ろの射的場をぼかして暗くする */
    body[data-state="title"] canvas,
    body[data-state="result"] canvas { filter: blur(6px) brightness(0.6); }
    /* 操作ボタン・照準・上部の表示は、カウントダウンとゲーム中だけ出す */
    body[data-state="title"] #stick, body[data-state="result"] #stick,
    body[data-state="title"] #shoot, body[data-state="result"] #shoot,
    body[data-state="title"] #crosshair, body[data-state="result"] #crosshair,
    body[data-state="title"] #hud-top, body[data-state="result"] #hud-top { display: none; }

    /* ===== ゲーム中の上部表示（残りの矢・残り時間・スコア） ===== */
    #hud-top {
      position: fixed;
      left: 50%;
      top: calc(8px + env(safe-area-inset-top));
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      padding: 6px 16px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: clamp(14px, 4vw, 18px);
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    #hud-top .label { font-size: 0.75em; opacity: 0.8; margin-right: 4px; }
    /* 残り時間が少なくなったら赤くする */
    #hud-time.warning { color: #ff4a3a; }

    /* ===== タイトル画面・リザルト画面（射的場の上に重ねる） ===== */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      color: #fff;
      text-align: center;
      background: rgba(5, 8, 30, 0.3);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }
    .screen.show { display: flex; }
    .screen h1 {
      margin: 0;
      font-size: clamp(48px, 13vw, 96px);
      letter-spacing: 0.15em;
      text-shadow: 0 4px 0 #a01010, 0 0 24px rgba(255, 90, 40, 0.8);
    }
    .screen h2 { margin: 0; font-size: 26px; letter-spacing: 0.2em; }
    .screen .help { font-size: 12px; opacity: 0.85; max-width: 32em; }
    .screen .best { font-size: 16px; }
    .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 10px 36px;
      border: 2px solid #fff;
      border-radius: 28px;
      background: #d8202a;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #7a0a0a;
    }
    .btn.sub { background: rgba(255, 255, 255, 0.15); box-shadow: none; }
    #result-score { font-size: 56px; font-weight: bold; color: #ffe14d; line-height: 1; }
    #result-score small { font-size: 22px; margin-left: 4px; color: #fff; }
    .result-rows { display: grid; grid-template-columns: auto auto; gap: 2px 18px; font-size: 16px; }
    .result-rows dt { text-align: right; opacity: 0.8; }
    .result-rows dd { margin: 0; text-align: left; font-weight: bold; }
    #new-record {
      display: none;
      color: #ffe14d;
      font-size: 24px;
      font-weight: bold;
      animation: record-blink 0.6s ease-in-out infinite alternate;
    }
    #new-record.show { display: block; }
    @keyframes record-blink { from { opacity: 1; transform: scale(1.05); } to { opacity: 0.6; transform: scale(1); } }

    /* ===== カウントダウン（3・2・1・スタート！） ===== */
    #countdown {
      position: fixed;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: clamp(64px, 18vw, 120px);
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 0 4px 0 #a01010, 0 0 20px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      display: none;
    }
    #countdown.show { display: block; animation: count-pop 0.9s ease-out forwards; }
    @keyframes count-pop {
      0%   { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
      15%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      75%  { opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }
  </style>
</head>
<body data-state="title">
  <!-- バージョン番号：コミットするたびに数字を上げること -->
  <div id="version">v1.0</div>
  <div id="sound">🔊</div>
  <!-- ゲーム中の上部表示 -->
  <div id="hud-top">
    <span><span class="label">矢</span><span id="hud-arrows">10</span></span>
    <span><span class="label">残り</span><span id="hud-time">60</span></span>
    <span><span class="label">スコア</span><span id="hud-score">0</span></span>
  </div>
  <div id="countdown"></div>
  <!-- タイトル画面 -->
  <div id="title-screen" class="screen">
    <h1>鏡射的</h1>
    <button id="start-btn" class="btn">スタート</button>
    <div class="best">ベストスコア：<span id="title-best">0</span>点</div>
    <div class="help">移動: スティック左右 / A・D ・ 狙い: 画面をドラッグ ・ 射撃: SHOOT / 右クリック / F<br>
      鏡で矢を反射させて、衝立の裏の風船も割ろう。1本でまとめて割るとボーナス！</div>
  </div>
  <!-- リザルト画面 -->
  <div id="result-screen" class="screen">
    <h2>結果</h2>
    <div id="new-record">NEW RECORD!</div>
    <div id="result-score">0<small>点</small></div>
    <dl class="result-rows">
      <dt>割った数</dt><dd id="result-popped">0個</dd>
      <dt>最大同時割り</dt><dd id="result-multi">×0</dd>
      <dt>ベストスコア</dt><dd id="result-best">0点</dd>
    </dl>
    <div class="buttons">
      <button id="retry-btn" class="btn">もう一度</button>
      <button id="to-title-btn" class="btn sub">タイトルへ</button>
    </div>
  </div>
  <div id="stick"><div id="stick-knob"></div></div>
  <div id="shoot">SHOOT</div>
  <div id="crosshair"></div>
  <div id="hit-popup"></div>

  <!-- Three.js を CDN から ES Module として読み込む -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================
    // 調整用パラメータ
    // =========================================================
    const PLAYER_RADIUS = 0.5;      // 主人公（カプセル）の半径
    const PLAYER_HEIGHT = 2.0;      // 主人公の全高（足元〜頭）
    const MOVE_SPEED = 4.0;         // 射的台の後ろを左右に動く速さ [m/s]

    // ---- ゲームのルール ----
    const ARROW_COUNT = 10;         // 1ゲームで撃てる矢の本数
    const TIME_LIMIT = 60;          // 制限時間 [秒]
    const SCORE_NORMAL = 1;         // 止まっている風船の点数
    const SCORE_GOLD = 3;           // 金色の（動く）風船の点数
    const MULTI_HIT_BONUS = 1;      // 1本で複数割ったときのボーナス：2個目以降、1個ごとにこの点数ずつ増える
                                    //   （止まった風船を ×3 なら 1 + (1+1) + (1+2) = 6点）
    const WARNING_TIME = 10;        // 残り時間がこの秒数以下になったら赤く表示し、毎秒「ピッ」と鳴らす
    const COUNTDOWN_STEP = 1.0;     // カウントダウン「3・2・1」の1つあたりの時間 [秒]
    const BEST_SCORE_KEY = 'mirror-shooting-best'; // ベストスコアを保存する localStorage のキー

    // ---- 射的場の大きさ ----
    // 座標：射的台の手前の面が z=0。プレイヤーは z<0 側に立ち、+Z 方向（奥）を向く
    const COUNTER_WIDTH = 8.0;      // 射的台（横長のカウンター）の幅 [m]。プレイヤーはこの幅の中だけ動ける
    const COUNTER_HEIGHT = 1.0;     // 射的台の高さ [m]
    const COUNTER_DEPTH = 0.7;      // 射的台の奥行き [m]
    const AREA_HALF_WIDTH = 7.0;    // 風船エリアの幅の半分 [m]（左右の壁の内側の面の位置）
    const AREA_DEPTH = 15.0;        // 風船エリアの奥行き [m]（射的台の奥から奥の壁まで）
    const AREA_BACK_Z = COUNTER_DEPTH + AREA_DEPTH; // 奥の壁の内側の面の位置
    // 衝立（ついたて）：風船エリアの真ん中に立つ木の板。この裏の風船は鏡で反射させないと狙えない
    const PARTITION = { x: 0, z: 9.0, width: 8.0, height: 2.4, thickness: 0.2 };

    // ---- 鏡の配置 ----
    // x, z は鏡の中心、y は下端の高さ、yaw は鏡の面が向いている方向 [度]
    //   （0 で +Z 向き、90 で +X 向き、180 で手前向き。鏡は両面とも反射する）
    const MIRROR_WIDTH = 2.0;       // 鏡の幅 [m]
    const MIRROR_HEIGHT = 2.0;      // 鏡の高さ [m]
    const MIRROR_THICKNESS = 0.1;   // 鏡の厚さ [m]
    const MIRROR_FRAME_WIDTH = 0.1; // 鏡の木の枠の太さ [m]（枠に当たった矢は反射せずに消える）
    const MIRRORS = [
      { x: -6.9, y: 0.3, z: 8.0, yaw: 90 },   // 左の壁ぎわ：右側から撃つと、衝立の左を回り込んで裏へ
      { x: 6.9, y: 0.3, z: 8.0, yaw: -90 },   // 右の壁ぎわ：左側から撃つと、衝立の右を回り込んで裏へ
      { x: -5.5, y: 0.3, z: 15.0, yaw: 151 }, // 奥・左：斜めに向けて、衝立の裏の真ん中へ跳ね返す
      { x: 5.5, y: 0.3, z: 15.0, yaw: -151 }, // 奥・右：同じく右から
    ];

    // ---- 風船の配置（全部で20個） ----
    // 止まっている風船（14個）：[x, y, z]。y は風船の中心の高さ [m]。その場でふわふわ揺れる
    const STATIC_BALLOONS = [
      [-5.0, 0.6, 3.5], [-2.0, 1.8, 4.0], [1.0, 0.8, 3.0], [4.5, 2.6, 4.5],
      [-5.0, 3.2, 6.0], [2.5, 1.4, 6.5], [5.2, 0.9, 5.5],
      [-5.5, 2.2, 12.0], [5.0, 3.4, 13.5], [-3.0, 3.0, 15.0],
      // ↓ 衝立の裏に隠れていて、鏡で反射させないと狙えない風船
      [-1.0, 1.3, 12.5], [1.0, 1.1, 12.5], [0.0, 1.5, 10.5], [3.5, 0.5, 15.0],
    ];
    // 動く風船（6個、金色）：center は往復の中心、axis は動く向き、range は中心からの振れ幅 [m]、
    //   period は1往復の時間 [秒]、phase は動き出しのずれ [秒]。
    //   位置はゲーム開始からの経過時間だけで決まるので、毎回まったく同じ動きになる
    const MOVING_BALLOONS = [
      { center: [0.0, 2.0, 5.5], axis: [1, 0, 0], range: 3.0, period: 4.0, phase: 0 },    // 横に往復
      { center: [0.0, 3.3, 13.0], axis: [1, 0, 0], range: 3.5, period: 5.0, phase: 1.0 },  // 横に往復（衝立の上）
      { center: [-5.5, 2.0, 10.5], axis: [0, 1, 0], range: 1.2, period: 3.5, phase: 0 },  // 縦に往復
      { center: [4.0, 2.0, 2.8], axis: [0, 1, 0], range: 1.3, period: 3.0, phase: 0.5 },  // 縦に往復
      { center: [-2.5, 2.0, 7.0], axis: [1, 1, 0], range: 1.5, period: 4.5, phase: 0 },   // 斜めに往復
      { center: [4.0, 2.2, 11.5], axis: [-1, 1, 0], range: 1.5, period: 5.5, phase: 2.0 }, // 斜めに往復
    ];

    // ---- 見た目：風船 ----
    const BALLOON_RADIUS = 0.45;    // 風船の半径 [m]（当たり判定も同じ大きさ）
    const BALLOON_STRETCH = 1.2;    // 風船の縦長さ（縦の半径 = BALLOON_RADIUS × この値）
    const BALLOON_COLORS = [        // 止まっている風船の色。STATIC_BALLOONS の順に、この並びをくり返して割り当てる
      0xe8322f, // 赤
      0xfde84a, // 黄（金色の動く風船と見分けやすいよう、明るいレモン色）
      0x2a8cf0, // 青
      0x3cb24a, // 緑
      0xff7eb6, // ピンク
    ];
    const BALLOON_GOLD_COLOR = 0xe0a020; // 動く風船の色（金色）
    const BALLOON_GOLD_GLOW_SPEED = 5.0; // 金色の風船の光が明滅する速さ（ひと目で分かるように）
    const BALLOON_BOB_AMPLITUDE = 0.05; // 止まっている風船がふわふわ揺れる幅（片側）[m]。上下合わせて 10cm
    const BALLOON_BOB_PERIOD = 2.4;     // ふわふわ1往復にかかる時間 [秒]
    const BALLOON_RESPAWN_DELAY = 3.0;  // 風船が全部割れてから復活するまでの時間 [秒]
    const BALLOON_POP_PIECES = 14;      // 割れたときに散る破片の数

    // ---- 見た目：夜の縁日の射的場 ----
    const SKY_COLOR = 0x0b1233;     // 夜空（暗い紺色）。霧の色にも使う
    const FLOOR_COLOR = 0x9a6a3c;   // 床（木の板）
    const FLOOR_HALF = 30;          // 床の広さの半分 [m]（射的場の外まで敷いておく）
    const WALL_COLOR = 0x4a2e1c;    // 射的場の壁
    const WALL_HEIGHT = 4.0;        // 射的場の壁の高さ [m]
    const WOOD_COLOR = 0xb07a42;    // 射的台・衝立の木
    const MIRROR_FRAME_COLOR = 0x7a4a24; // 鏡の木の枠
    const CURTAIN_RED = 0xd8202a;   // 紅白幕の赤
    const CURTAIN_WHITE = 0xf4f0ea; // 紅白幕の白
    const CURTAIN_STRIPE_WIDTH = 0.6; // 紅白幕のしま1本の幅 [m]
    const LANTERN_COLOR = 0xff3a1e; // 提灯の色（自分で光る）
    const LANTERNS_PER_WALL = 8;    // 壁1面あたりの提灯の数（左・右・奥の3面に並べる）
    const LANTERN_LIGHT_COUNT = 4;  // 実際に周りを照らすライトの数（スマホの負荷を抑えるため少なめ）
    const LANTERN_LIGHT_INTENSITY = 15; // 提灯のライトの明るさ

    // ---- カメラ・狙い ----
    const CAMERA_DISTANCE = 3.6;    // カメラをプレイヤーのどれだけ後ろに置くか [m]
    const CAMERA_HEIGHT = 2.5;      // カメラの高さ（足元基準）[m]。頭より少し上から見下ろして、プレイヤーで画面が隠れないように
    const CAMERA_SHOULDER = 1.0;    // カメラを右にずらす量 [m]（肩越しに見て、照準がプレイヤーに隠れないように）
    const CAMERA_SMOOTH = 10.0;     // カメラがプレイヤーの左右移動に追従する滑らかさ（大きいほどキビキビ）
    const AIM_YAW_LIMIT = 60;       // 狙いを左右に動かせる範囲 [度]（正面から ±）
    const AIM_PITCH_LIMIT = 30;     // 狙いを上下に動かせる範囲 [度]（水平から ±）
    const CAMERA_YAW_SENSITIVITY = 0.004;   // 横ドラッグ1pxあたりの左右の回転量 [ラジアン]
    const CAMERA_PITCH_SENSITIVITY = 0.004; // 縦ドラッグ1pxあたりの上下の回転量 [ラジアン]
    const CAMERA_INVERT_Y = false;  // true にすると縦ドラッグの上下を反転
    const ARROW_SPEED = 30.0;       // 矢の速さ [m/s]
    const ARROW_LIFETIME = 5.0;     // 矢が消えるまでの時間 [秒]（重力なしでまっすぐ飛び続ける）
    const ARROW_MAX_REFLECTIONS = 5; // 1本の矢が鏡で反射できる最大回数（これを超えて鏡に当たると消える）
    const GUIDE_REFLECTIONS = 1;    // 撃つ前の予測線で見せる反射の回数（その先は反射直後の短い線だけ）
    const GUIDE_AFTER_LENGTH = 1.0; // 最後に見せる反射の直後に描く短い線の長さ [m]
    const GUIDE_OPACITY = 0.35;     // 予測線の濃さ（0〜1）
    const TRAIL_OPACITY = 0.7;      // 飛んでいる矢の光の尾の濃さ（0〜1）
    const TRAIL_FADE_TIME = 1.0;    // 矢が消えてから光の尾が消えるまでの時間 [秒]
    const ARROW_HEIGHT = 1.3;       // 矢を撃ち出す高さ（足元基準。胸の高さ）
    const CROSSHAIR_RAISE = 0;      // 照準を画面中央からどれだけ上に置くか（画面の高さに対する割合）
    const AIM_FAR_DISTANCE = 100;   // 照準の先に何もないとき（空など）に狙う地点までの距離 [m]
    const SHOOT_COOLDOWN = 0.4;     // 射撃のクールダウン [秒]（連打防止）
    const SE_MASTER_VOLUME = 0.7;   // 効果音全体の音量（0〜1）
    const SE_VOLUMES = {            // 効果音ごとの音量（0〜1、全体音量に掛け合わされる）
      shoot: 0.5,   // 矢を撃つ「ヒュッ」
      pop: 0.7,     // 風船が割れる「パンッ」
      reflect: 0.5, // 矢が鏡で反射「キンッ」
      beep: 0.45,   // カウントダウン・残り時間わずか「ピッ」
      beepStart: 0.5, // カウントダウンの「スタート！」
    };

    // =========================================================
    // 効果音（Web Audio API で音をその場で合成する。音声ファイルは使わない）
    //
    // 音割れ対策：
    //  ・全ての音を マスター音量 → コンプレッサー（リミッター代わり）に通してから出力
    //  ・音の出だしと終わりは必ず音量を0付近から/まで滑らかに変化させ、プチッというノイズを防ぐ
    //  ・同じ音は「同時に鳴らせる数」と「最短の再生間隔」を制限して、重なりすぎないようにする
    // =========================================================
    const sound = {
      ctx: null,         // AudioContext（最初のタッチ/キー入力で作る）
      master: null,      // マスター音量ノード
      noiseBuffer: null, // 風切り音などに使うホワイトノイズ
      enabled: true,     // ON/OFF
      voices: {},        // 効果音ごとの現在の同時再生数
      lastPlayed: {},    // 効果音ごとの最後に鳴らした時刻
    };
    const SE_MAX_VOICES = 3;      // 同じ効果音を同時に鳴らせる最大数
    const SE_MIN_INTERVAL = 0.03; // 同じ効果音を鳴らす最短間隔 [秒]

    // ON/OFF の設定はブラウザに保存しておく（保存できない環境でも動くよう try で囲む）
    try { sound.enabled = localStorage.getItem('bow-action-sound') !== 'off'; } catch (e) { /* 何もしない */ }

    // 音声を有効化する。スマホのブラウザはユーザー操作の中でしか音を鳴らし始められないため、
    // 最初のタッチ/クリック/キー入力のイベント内でこれを呼ぶ
    function unlockAudio() {
      if (!sound.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return; // Web Audio 非対応ブラウザでは音なしで遊べるようにする
        const ctx = new AudioCtx();
        sound.ctx = ctx;

        // マスター音量 → コンプレッサー → スピーカー
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -12;
        compressor.knee.value = 6;
        compressor.ratio.value = 12;
        compressor.attack.value = 0.002;
        compressor.release.value = 0.1;
        compressor.connect(ctx.destination);
        sound.master = ctx.createGain();
        sound.master.gain.value = SE_MASTER_VOLUME;
        sound.master.connect(compressor);

        // 0.5秒ぶんのホワイトノイズを作っておき、使い回す
        const length = Math.floor(ctx.sampleRate * 0.5);
        sound.noiseBuffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = sound.noiseBuffer.getChannelData(0);
        for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;

        // iOS Safari 対策：無音を一瞬鳴らしておくと、以降の再生が確実に許可される
        const silent = ctx.createBufferSource();
        silent.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        silent.connect(ctx.destination);
        silent.start();
      }
      if (sound.ctx.state === 'suspended') sound.ctx.resume();
    }
    // 最初の操作で有効化。capture: true でボタンやキャンバスより先に受け取る
    for (const type of ['pointerdown', 'touchend', 'keydown', 'click']) {
      window.addEventListener(type, unlockAudio, { capture: true, passive: true });
    }

    // 音量の包絡線（エンベロープ）付きのゲインノードを作る
    // attack 秒で peak まで上げ、duration 秒かけて0付近まで下げる
    function envelope(ctx, t, peak, attack, duration) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      return g;
    }

    // 発振器（ピッチを from → to へ duration 秒で変化させる）
    function sweepOsc(ctx, type, t, from, to, duration) {
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(to, t + duration);
      return osc;
    }

    // ノイズ音源
    function noiseSource(ctx) {
      const src = ctx.createBufferSource();
      src.buffer = sound.noiseBuffer;
      return src;
    }

    // 効果音ごとの合成レシピ。out（出力先）に繋ぎ、鳴らした音源の配列と長さを返す
    const SE_RECIPES = {
      // ヒュッ：ノイズをバンドパスフィルタに通し、中心周波数を高→低へ素早く動かす
      shoot(ctx, t, out) {
        const src = noiseSource(ctx);
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 2.5;
        filter.frequency.setValueAtTime(4000, t);
        filter.frequency.exponentialRampToValueAtTime(900, t + 0.14);
        const env = envelope(ctx, t, 3.0, 0.01, 0.16); // フィルタで音が細くなるぶん大きめに
        src.connect(filter).connect(env).connect(out);
        src.start(t);
        src.stop(t + 0.17);
        return [src];
      },
      // パンッ：広い帯域のノイズをごく短く鳴らして破裂させ、低い「ボッ」で空気が抜ける重みを足す
      pop(ctx, t, out) {
        const burst = noiseSource(ctx);
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1800;
        bp.Q.value = 0.6;
        const burstEnv = envelope(ctx, t, 2.2, 0.001, 0.09);
        burst.connect(bp).connect(burstEnv).connect(out);
        burst.start(t);
        burst.stop(t + 0.1);

        const osc = sweepOsc(ctx, 'sine', t, 260, 70, 0.06);
        const env = envelope(ctx, t, 1.2, 0.001, 0.08);
        osc.connect(env).connect(out);
        osc.start(t);
        osc.stop(t + 0.09);
        return [burst, osc];
      },
      // ピッ：短い高めのサイン波
      beep(ctx, t, out) {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, t);
        const env = envelope(ctx, t, 1.0, 0.003, 0.1);
        osc.connect(env).connect(out);
        osc.start(t);
        osc.stop(t + 0.11);
        return [osc];
      },
      // スタート！の「ピーッ」：ピッより高く、少し長く
      beepStart(ctx, t, out) {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1500, t);
        const env = envelope(ctx, t, 1.0, 0.003, 0.45);
        osc.connect(env).connect(out);
        osc.start(t);
        osc.stop(t + 0.46);
        return [osc];
      },
      // キンッ：倍音関係にない高い2音を重ねて金属っぽくし、すっと減衰させる
      reflect(ctx, t, out) {
        const sources = [];
        for (const [freq, peak] of [[2600, 0.9], [3900, 0.5], [5300, 0.25]]) {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          const env = envelope(ctx, t, peak, 0.002, 0.35);
          osc.connect(env).connect(out);
          osc.start(t);
          osc.stop(t + 0.36);
          sources.push(osc);
        }
        // 当たった瞬間の「カッ」というアタック
        const click = noiseSource(ctx);
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 4000;
        const clickEnv = envelope(ctx, t, 0.6, 0.001, 0.02);
        click.connect(hp).connect(clickEnv).connect(out);
        click.start(t);
        click.stop(t + 0.03);
        sources.push(click);
        return sources;
      },
    };

    // 効果音を鳴らす
    function playSound(name) {
      const ctx = sound.ctx;
      if (!sound.enabled || !ctx || ctx.state !== 'running') return;

      // 同じ音の鳴らしすぎを防ぐ（短すぎる間隔・同時再生数オーバーなら鳴らさない）
      const now = ctx.currentTime;
      if (now - (sound.lastPlayed[name] ?? -1) < SE_MIN_INTERVAL) return;
      if ((sound.voices[name] ?? 0) >= SE_MAX_VOICES) return;
      sound.lastPlayed[name] = now;

      // 効果音ごとの音量ノードを挟んでマスターへ繋ぐ
      const out = ctx.createGain();
      out.gain.value = SE_VOLUMES[name] ?? 1;
      out.connect(sound.master);
      const sources = SE_RECIPES[name](ctx, now, out);

      // 再生が全部終わったら同時再生数を戻し、ノードを切り離す
      sound.voices[name] = (sound.voices[name] ?? 0) + 1;
      let remaining = sources.length;
      for (const src of sources) {
        src.onended = () => {
          if (--remaining > 0) return;
          sound.voices[name]--;
          out.disconnect();
        };
      }
    }

    // =========================================================
    // レンダラー・シーン・カメラの初期化
    // =========================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    // スマホの高解像度画面で重くなりすぎないよう、ピクセル比は最大2に制限
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(SKY_COLOR);
    scene.fog = new THREE.Fog(SKY_COLOR, 40, 110);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);

    // ライト：夜なので全体はほんのり暗く。青白い月明かり（影あり）＋ 提灯の暖かい光（少数のライト）
    scene.add(new THREE.HemisphereLight(0x5566aa, 0x2a1a10, 0.7));
    const moon = new THREE.DirectionalLight(0xaabbff, 0.7);
    moon.position.set(10, 20, 8);
    moon.castShadow = true;
    moon.shadow.mapSize.set(1024, 1024);
    moon.shadow.camera.left = -30;
    moon.shadow.camera.right = 30;
    moon.shadow.camera.top = 30;
    moon.shadow.camera.bottom = -30;
    scene.add(moon);

    // 画像ファイルを使わず、canvas に描いた絵をテクスチャにする
    function makeCanvasTexture(width, height, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      draw(canvas.getContext('2d'), width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }
    // 基準の色を少し明るく/暗くした CSS の色文字列を返す（木目のムラなどに使う）
    function shade(hex, lightness) {
      return new THREE.Color(hex).offsetHSL(0, 0, lightness).getStyle();
    }

    // =========================================================
    // ステージ（夜の縁日の射的場）
    // 手前に射的台、その奥が風船エリア（左・右・奥を壁で囲む）。手前側は開いている。
    // 当たり判定は全て「軸に平行な箱（AABB）」で管理する（鏡だけは別）
    // =========================================================
    const colliders = []; // { min: Vector3, max: Vector3 } の配列

    // 箱を作ってシーンと当たり判定リストの両方に登録する関数
    // x, z は箱の中心、y は箱の底面の高さ。material には色（数値）かマテリアルを渡す
    function addBox(x, y, z, w, h, d, material) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        typeof material === 'number' ? new THREE.MeshStandardMaterial({ color: material }) : material
      );
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      colliders.push({
        min: new THREE.Vector3(x - w / 2, y, z - d / 2),
        max: new THREE.Vector3(x + w / 2, y + h, z + d / 2),
      });
      return mesh;
    }

    // ---- 床：木の板（上面が y=0 になるよう、厚みぶん下にずらす） ----
    // 1枚の絵に板を8枚描き、それを床全体にくり返し貼る（1枚の絵 = 4m 四方）
    const PLANK_SHADES = [0.02, -0.03, 0.05, -0.01, 0.03, -0.05, 0.0, -0.02]; // 板ごとの明るさのムラ（固定）
    const floorTexture = makeCanvasTexture(256, 256, (g, w, h) => {
      const rowH = h / PLANK_SHADES.length;
      PLANK_SHADES.forEach((lightness, row) => {
        g.fillStyle = shade(FLOOR_COLOR, lightness);
        g.fillRect(0, row * rowH, w, rowH);
        // 板の継ぎ目（段ごとに位置をずらす）
        g.fillStyle = shade(FLOOR_COLOR, -0.18);
        g.fillRect(((row * 97) % w), row * rowH, 2, rowH);
        // 板と板のすき間
        g.fillRect(0, row * rowH, w, 2);
      });
    });
    floorTexture.repeat.set(FLOOR_HALF * 2 / 4, FLOOR_HALF * 2 / 4);
    addBox(0, -1, 0, FLOOR_HALF * 2, 1, FLOOR_HALF * 2, new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.85 }));

    // ---- 木の板の絵（射的台・衝立に使う）：横板の継ぎ目と外枠 ----
    const woodTexture = makeCanvasTexture(128, 128, (g, w, h) => {
      g.fillStyle = shade(WOOD_COLOR, 0);
      g.fillRect(0, 0, w, h);
      g.fillStyle = shade(WOOD_COLOR, -0.12);
      for (let i = 1; i < 4; i++) g.fillRect(0, (h / 4) * i - 1, w, 2);
      g.strokeStyle = shade(WOOD_COLOR, -0.2);
      g.lineWidth = 12;
      g.strokeRect(6, 6, w - 12, h - 12);
    });
    const woodMaterial = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.8 });

    // ---- 射的台（横長のカウンター）。プレイヤーはこの後ろに立つ ----
    addBox(0, 0, COUNTER_DEPTH / 2, COUNTER_WIDTH, COUNTER_HEIGHT, COUNTER_DEPTH, woodMaterial);

    // ---- 衝立：この裏に隠れた風船は、鏡で反射させないと狙えない ----
    addBox(PARTITION.x, 0, PARTITION.z + PARTITION.thickness / 2,
      PARTITION.width, PARTITION.height, PARTITION.thickness, woodMaterial);

    // ---- 風船エリアの壁（左・右・奥。高さ WALL_HEIGHT）。当たり判定あり、当たった矢は消える ----
    const WALL_THICKNESS = 0.5;
    const wallMaterial = new THREE.MeshStandardMaterial({ color: WALL_COLOR, roughness: 0.9 });
    const sideWallLength = AREA_BACK_Z + WALL_THICKNESS; // 射的台の手前の面（z=0）から奥の壁の裏まで
    addBox(-AREA_HALF_WIDTH - WALL_THICKNESS / 2, 0, sideWallLength / 2, WALL_THICKNESS, WALL_HEIGHT, sideWallLength, wallMaterial); // 左
    addBox(AREA_HALF_WIDTH + WALL_THICKNESS / 2, 0, sideWallLength / 2, WALL_THICKNESS, WALL_HEIGHT, sideWallLength, wallMaterial);  // 右
    addBox(0, 0, AREA_BACK_Z + WALL_THICKNESS / 2, AREA_HALF_WIDTH * 2, WALL_HEIGHT, WALL_THICKNESS, wallMaterial);                  // 奥

    // 壁3面それぞれの「内側の面の中心」「内側を向く方向」「長さ」（幕・提灯・ライトの配置に使う）
    const WALL_SIDES = [
      { center: new THREE.Vector3(-AREA_HALF_WIDTH, 0, AREA_BACK_Z / 2), inward: new THREE.Vector3(1, 0, 0), length: AREA_BACK_Z },
      { center: new THREE.Vector3(0, 0, AREA_BACK_Z), inward: new THREE.Vector3(0, 0, -1), length: AREA_HALF_WIDTH * 2 },
      { center: new THREE.Vector3(AREA_HALF_WIDTH, 0, AREA_BACK_Z / 2), inward: new THREE.Vector3(-1, 0, 0), length: AREA_BACK_Z },
    ];
    // 壁に沿った横方向（内側を向いたときの右手方向）
    const alongWall = (side) => new THREE.Vector3(-side.inward.z, 0, side.inward.x);

    // ---- 紅白幕（赤と白の縦じま） ----
    const CURTAIN_BOTTOM = 0.3, CURTAIN_TOP = 2.9;
    const curtainTexture = makeCanvasTexture(64, 4, (g, w, h) => {
      g.fillStyle = new THREE.Color(CURTAIN_RED).getStyle();
      g.fillRect(0, 0, w / 2, h);
      g.fillStyle = new THREE.Color(CURTAIN_WHITE).getStyle();
      g.fillRect(w / 2, 0, w / 2, h);
    });
    for (const side of WALL_SIDES) {
      // 壁ごとに長さが違うので、しまの幅がそろうよう繰り返し回数を壁ごとに決める
      const texture = curtainTexture.clone();
      texture.needsUpdate = true;
      texture.repeat.set(side.length / (CURTAIN_STRIPE_WIDTH * 2), 1);
      const curtain = new THREE.Mesh(
        new THREE.PlaneGeometry(side.length, CURTAIN_TOP - CURTAIN_BOTTOM),
        new THREE.MeshStandardMaterial({ map: texture, roughness: 0.95 })
      );
      curtain.position.copy(side.center).addScaledVector(side.inward, 0.02); // 壁から少しだけ浮かせる
      curtain.position.y = (CURTAIN_BOTTOM + CURTAIN_TOP) / 2;
      curtain.rotation.y = Math.atan2(side.inward.x, side.inward.z); // 板の表（+Z）を内側へ向ける
      curtain.receiveShadow = true;
      scene.add(curtain);
    }

    // ---- 提灯（赤い光る球）。数が多いので InstancedMesh でまとめて描き、光は自己発光の素材で表現 ----
    const LANTERN_Y = WALL_HEIGHT - 0.6;  // 提灯の中心の高さ
    const LANTERN_INSET = 0.35;           // 壁の内側の面からの距離
    const lanternBodies = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.22, 16, 12),
      new THREE.MeshStandardMaterial({ color: LANTERN_COLOR, emissive: LANTERN_COLOR, emissiveIntensity: 1.3 }),
      WALL_SIDES.length * LANTERNS_PER_WALL
    );
    const lanternCaps = new THREE.InstancedMesh( // 提灯の上下の黒い輪
      new THREE.CylinderGeometry(0.13, 0.13, 0.06, 12),
      new THREE.MeshStandardMaterial({ color: 0x1a1210 }),
      WALL_SIDES.length * LANTERNS_PER_WALL * 2
    );
    const cordMaterial = new THREE.LineBasicMaterial({ color: 0x1a1210 });
    const lanternMatrix = new THREE.Matrix4();
    const lanternBodyScale = new THREE.Vector3(1, 1.35, 1); // 少し縦長
    const noRotation = new THREE.Quaternion();
    let lanternIndex = 0;
    for (const side of WALL_SIDES) {
      const along = alongWall(side);
      const base = side.center.clone().addScaledVector(side.inward, LANTERN_INSET);
      for (let i = 0; i < LANTERNS_PER_WALL; i++) {
        const offset = -side.length / 2 + (i + 0.5) * (side.length / LANTERNS_PER_WALL); // 等間隔
        const pos = base.clone().addScaledVector(along, offset);
        pos.y = LANTERN_Y;
        lanternBodies.setMatrixAt(lanternIndex, lanternMatrix.compose(pos, noRotation, lanternBodyScale));
        lanternCaps.setMatrixAt(lanternIndex * 2, lanternMatrix.makeTranslation(pos.x, pos.y + 0.3, pos.z));
        lanternCaps.setMatrixAt(lanternIndex * 2 + 1, lanternMatrix.makeTranslation(pos.x, pos.y - 0.3, pos.z));
        lanternIndex++;
      }
      // 提灯を吊るすひも（壁沿いに1本）
      const cordY = LANTERN_Y + 0.33;
      const cord = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
        base.clone().addScaledVector(along, -side.length / 2).setY(cordY),
        base.clone().addScaledVector(along, side.length / 2).setY(cordY),
      ]), cordMaterial);
      scene.add(cord);
    }
    scene.add(lanternBodies, lanternCaps);

    // 実際のライトは少しだけ。壁の周りに等間隔に置いて、提灯の暖かい光が届いているように見せる
    for (let i = 0; i < LANTERN_LIGHT_COUNT; i++) {
      // 壁3面をつなげた長さを1周として、その上の等間隔の位置に置く
      const around = (i + 0.5) * WALL_SIDES.length / LANTERN_LIGHT_COUNT;
      const side = WALL_SIDES[Math.floor(around)];
      const pos = side.center.clone()
        .addScaledVector(alongWall(side), (around % 1 - 0.5) * side.length)
        .addScaledVector(side.inward, 2.5); // 壁に近すぎると幕が白飛びするので少し内側に置く
      pos.y = LANTERN_Y;
      const light = new THREE.PointLight(0xff7a40, LANTERN_LIGHT_INTENSITY, 30, 1.4);
      light.position.copy(pos);
      scene.add(light);
    }

    // =========================================================
    // 鏡（水色の薄い板＋木の枠）
    // 鏡は斜めに置けるので、軸に平行な箱（AABB）の colliders には入れず、
    // 「鏡の中心・面の向き（normal）・横方向（right）」を持つ回転した箱として別に扱う。
    // 当たり判定は鏡のローカル座標（right, 上, normal）に変換して行う。
    // =========================================================
    const MIRROR_HALF = new THREE.Vector3(MIRROR_WIDTH / 2, MIRROR_HEIGHT / 2, MIRROR_THICKNESS / 2);
    const mirrorMaterial = new THREE.MeshStandardMaterial({
      color: 0x8fe3ff,
      emissive: 0x3fb6e0,       // 少し光らせる
      emissiveIntensity: 0.5,
      metalness: 0.3,
      roughness: 0.2,
    });
    const F = MIRROR_FRAME_WIDTH;
    // 鏡の面（枠の内側）。当たり判定の箱より少し薄くして、枠の中に収まって見えるようにする
    const mirrorGlassGeometry = new THREE.BoxGeometry(MIRROR_WIDTH - F * 2, MIRROR_HEIGHT - F * 2, MIRROR_THICKNESS * 0.5);
    const mirrorFrameMaterial = new THREE.MeshStandardMaterial({ color: MIRROR_FRAME_COLOR, roughness: 0.8 });
    // 木の枠：上下の横木と左右の縦木 [幅, 高さ, x, y]
    const MIRROR_FRAME_PARTS = [
      [MIRROR_WIDTH, F, 0, MIRROR_HEIGHT / 2 - F / 2],
      [MIRROR_WIDTH, F, 0, -MIRROR_HEIGHT / 2 + F / 2],
      [F, MIRROR_HEIGHT - F * 2, MIRROR_WIDTH / 2 - F / 2, 0],
      [F, MIRROR_HEIGHT - F * 2, -MIRROR_WIDTH / 2 + F / 2, 0],
    ];
    const mirrors = MIRRORS.map(({ x, y, z, yaw }) => {
      const rad = THREE.MathUtils.degToRad(yaw);
      const mesh = new THREE.Group();
      mesh.add(new THREE.Mesh(mirrorGlassGeometry, mirrorMaterial));
      for (const [w, h, px, py] of MIRROR_FRAME_PARTS) {
        const part = new THREE.Mesh(new THREE.BoxGeometry(w, h, MIRROR_THICKNESS), mirrorFrameMaterial);
        part.position.set(px, py, 0);
        mesh.add(part);
      }
      mesh.traverse((o) => { o.castShadow = true; o.receiveShadow = true; });
      mesh.position.set(x, y + MIRROR_HEIGHT / 2, z);
      mesh.rotation.y = rad;
      scene.add(mesh);
      return {
        center: mesh.position.clone(),
        normal: new THREE.Vector3(Math.sin(rad), 0, Math.cos(rad)), // 鏡の面の向き（ローカル +Z）
        right: new THREE.Vector3(Math.cos(rad), 0, -Math.sin(rad)), // 鏡の横方向（ローカル +X）
        localBox: { min: MIRROR_HALF.clone().negate(), max: MIRROR_HALF.clone() },
      };
    });

    // 鏡のローカル座標の点が「反射する面」の上か（表か裏の面で、木の枠より内側）
    function isMirrorFace(local) {
      return Math.abs(Math.abs(local.z) - MIRROR_HALF.z) < 1e-4 &&
             Math.abs(local.x) <= MIRROR_HALF.x - MIRROR_FRAME_WIDTH &&
             Math.abs(local.y) <= MIRROR_HALF.y - MIRROR_FRAME_WIDTH;
    }

    // ワールド座標の点・方向を、鏡のローカル座標（x: 横, y: 上, z: 面の向き）に変換する
    function toMirrorLocal(mirror, v, out, isDirection = false) {
      const dx = v.x - (isDirection ? 0 : mirror.center.x);
      const dy = v.y - (isDirection ? 0 : mirror.center.y);
      const dz = v.z - (isDirection ? 0 : mirror.center.z);
      return out.set(
        dx * mirror.right.x + dz * mirror.right.z,
        dy,
        dx * mirror.normal.x + dz * mirror.normal.z
      );
    }

    // =========================================================
    // 風船（的）。矢は風船を貫通し、当たった風船は一瞬で割れる
    // 当たり判定は見た目と同じ「縦長の球（楕円体）」。上下にふわふわ揺れるので、
    // 判定にも揺れたあとの中心（balloon.center）を使う。
    // 止まっている風船はその場でふわふわ揺れ、動く風船（金色）は決まった向きに往復する。
    // =========================================================
    const BALLOON_HALF_HEIGHT = BALLOON_RADIUS * BALLOON_STRETCH;
    const balloonGeometry = new THREE.SphereGeometry(BALLOON_RADIUS, 24, 16);
    const balloonKnotGeometry = new THREE.ConeGeometry(0.05, 0.08, 8);
    const BALLOON_STRING_LENGTH = 0.35;
    const balloonStringGeometry = new THREE.CylinderGeometry(0.006, 0.006, BALLOON_STRING_LENGTH, 4);
    const balloonStringMaterial = new THREE.MeshBasicMaterial({ color: 0xdddddd });

    // 風船を1つ作る。motion があれば動く風船（金色）、なければ止まっている風船
    function createBalloon(color, base, phase, motion = null) {
      const material = new THREE.MeshStandardMaterial({
        color,
        roughness: motion ? 0.25 : 0.3,
        metalness: motion ? 0.5 : 0,  // 金色の風船は少し金属っぽく光らせて、ひと目で分かるように
        emissive: color,
        emissiveIntensity: 0.15, // 夜でも色が分かるよう、ほんのり光らせる（金色は明滅させる）
      });
      const group = new THREE.Group();
      const body = new THREE.Mesh(balloonGeometry, material);
      body.scale.y = BALLOON_STRETCH; // 少し縦長に
      body.castShadow = true;
      group.add(body);
      // 下の小さな結び目（先端を上に向けた円錐）
      const knot = new THREE.Mesh(balloonKnotGeometry, material);
      knot.position.y = -BALLOON_HALF_HEIGHT - 0.02;
      group.add(knot);
      // 短い糸
      const string = new THREE.Mesh(balloonStringGeometry, balloonStringMaterial);
      string.position.y = -BALLOON_HALF_HEIGHT - 0.06 - BALLOON_STRING_LENGTH / 2;
      group.add(string);
      group.position.copy(base);
      scene.add(group);
      return {
        group,
        material,
        color,
        base,                    // 止まっている風船：揺れの中心 / 動く風船：往復の中心
        center: base.clone(),    // 今の中心（動いたあと）
        phase,                   // 動きのタイミングのずれ（毎回同じ値）
        motion,                  // 動く風船なら { axis, range, period }
        state: 'alive',          // 'alive'（浮いている）/ 'popped'（割れた）
      };
    }

    const balloons = [
      // 止まっている風船：色は並び順で固定
      ...STATIC_BALLOONS.map(([x, y, z], index) =>
        createBalloon(BALLOON_COLORS[index % BALLOON_COLORS.length], new THREE.Vector3(x, y, z), index * 1.3)),
      // 動く風船：金色
      ...MOVING_BALLOONS.map(({ center, axis, range, period, phase }) =>
        createBalloon(BALLOON_GOLD_COLOR, new THREE.Vector3(...center), phase, {
          axis: new THREE.Vector3(...axis).normalize(),
          range,
          period,
        })),
    ];
    let balloonRespawnTimer = 0; // 全部割れたあと、復活までの残り時間（0なら待機していない）
    let gameTime = 0;            // ゲーム開始からの経過時間。風船の位置はこれだけで決まる
    let goldGlow = 0;            // 金色の風船の今の光り具合

    // 経過時間 time のときの風船の中心を計算する（時間だけで決まるので毎回まったく同じ動き）
    function balloonPositionAt(balloon, time, out) {
      out.copy(balloon.base);
      if (balloon.motion) {
        // 動く風船：axis の向きに、中心から ±range の範囲を往復する
        const { axis, range, period } = balloon.motion;
        out.addScaledVector(axis, range * Math.sin(((time + balloon.phase) / period) * Math.PI * 2));
      } else {
        // 止まっている風船：その場でゆっくり上下にふわふわ
        out.y += BALLOON_BOB_AMPLITUDE * Math.sin((time / BALLOON_BOB_PERIOD) * Math.PI * 2 + balloon.phase);
      }
      return out;
    }

    // 点が風船（縦長の球）の中に入っているか
    function pointInBalloon(p, balloon) {
      const dx = (p.x - balloon.center.x) / BALLOON_RADIUS;
      const dy = (p.y - balloon.center.y) / BALLOON_HALF_HEIGHT;
      const dz = (p.z - balloon.center.z) / BALLOON_RADIUS;
      return dx * dx + dy * dy + dz * dz <= 1;
    }

    // レイと風船（縦長の球）の交差判定。縦方向を縮めて普通の球にしてから解く
    // tMin〜tMax の範囲で当たれば、その距離を返す。当たらなければ null
    function rayBalloon(origin, dir, balloon, tMin, tMax) {
      const ox = origin.x - balloon.center.x;
      const oy = (origin.y - balloon.center.y) / BALLOON_STRETCH;
      const oz = origin.z - balloon.center.z;
      const dy = dir.y / BALLOON_STRETCH;
      const a = dir.x * dir.x + dy * dy + dir.z * dir.z;
      const b = 2 * (ox * dir.x + oy * dy + oz * dir.z);
      const c = ox * ox + oy * oy + oz * oz - BALLOON_RADIUS * BALLOON_RADIUS;
      const disc = b * b - 4 * a * c;
      if (disc < 0) return null;
      const sq = Math.sqrt(disc);
      const t1 = (-b - sq) / (2 * a);
      const t2 = (-b + sq) / (2 * a);
      if (t2 < tMin || t1 > tMax) return null;
      return Math.max(t1, tMin);
    }

    // 風船を割る：一瞬で消して、同じ色の小さな破片を散らす
    function popBalloon(balloon) {
      balloon.state = 'popped';
      balloon.group.visible = false;
      playSound('pop');
      spawnPopPieces(balloon.center, balloon.color);
    }

    // ---- 割れたときの破片 ----
    const POP_PIECE_LIFE = 0.6; // 破片が消えるまでの時間 [秒]
    const popPieceGeometry = new THREE.PlaneGeometry(0.12, 0.09);
    const popBursts = []; // { material, pieces: [{ mesh, velocity, spin }], time }

    function spawnPopPieces(center, color) {
      // 1回の破裂でマテリアルを1つ作り、まとめて薄くしていく
      const material = new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide });
      const pieces = [];
      for (let i = 0; i < BALLOON_POP_PIECES; i++) {
        const mesh = new THREE.Mesh(popPieceGeometry, material);
        // 風船の表面あたりから、外向きのばらばらな方向へ飛ばす
        const dir = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();
        mesh.position.copy(center).addScaledVector(dir, BALLOON_RADIUS * 0.8);
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        scene.add(mesh);
        pieces.push({
          mesh,
          velocity: dir.multiplyScalar(2.5 + Math.random() * 2).add(new THREE.Vector3(0, 1, 0)),
          spin: new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10),
        });
      }
      popBursts.push({ material, pieces, time: POP_PIECE_LIFE });
    }

    function updatePopPieces(dt) {
      for (let i = popBursts.length - 1; i >= 0; i--) {
        const burst = popBursts[i];
        burst.time -= dt;
        const t = Math.max(0, burst.time / POP_PIECE_LIFE); // 1 → 0
        burst.material.opacity = t;
        for (const piece of burst.pieces) {
          piece.velocity.y -= 9.8 * dt; // 少し落ちながら散る
          piece.mesh.position.addScaledVector(piece.velocity, dt);
          piece.mesh.rotation.x += piece.spin.x * dt;
          piece.mesh.rotation.y += piece.spin.y * dt;
          piece.mesh.rotation.z += piece.spin.z * dt;
          piece.mesh.scale.setScalar(0.4 + 0.6 * t);
        }
        if (burst.time > 0) continue;
        for (const piece of burst.pieces) scene.remove(piece.mesh);
        burst.material.dispose();
        popBursts.splice(i, 1);
      }
    }

    // 風船の動き・全部割れたときの復活・破片を更新する
    // timeStep は風船の動きの時間を進める量（カウントダウン中は 0 にして止めておく）
    function updateBalloons(dt, timeStep = dt) {
      gameTime += timeStep;
      // 金色の風船はゆっくり明滅させて、動く風船だとひと目で分かるようにする
      goldGlow = 0.25 + 0.25 * Math.sin(gameTime * BALLOON_GOLD_GLOW_SPEED);
      for (const balloon of balloons) {
        balloonPositionAt(balloon, gameTime, balloon.center);
        balloon.group.position.copy(balloon.center);
        if (balloon.motion) balloon.material.emissiveIntensity = goldGlow;
      }

      // 全部割れたら一定時間後にまとめて復活させる
      if (balloonRespawnTimer > 0) {
        balloonRespawnTimer -= dt;
        if (balloonRespawnTimer <= 0) {
          for (const balloon of balloons) {
            balloon.state = 'alive';
            balloon.group.visible = true;
          }
        }
      } else if (balloons.every((b) => b.state === 'popped')) {
        balloonRespawnTimer = BALLOON_RESPAWN_DELAY;
      }

      updatePopPieces(dt);
    }

    // =========================================================
    // 主人公（青いカプセル）
    // player.position は「足元の中心」を表す。射的台のすぐ後ろで、左右（X）にだけ動く
    // =========================================================
    const PLAYER_Z = -(PLAYER_RADIUS + 0.1);                // 射的台の手前に立つ位置（前後には動かない）
    const PLAYER_X_LIMIT = COUNTER_WIDTH / 2 - PLAYER_RADIUS; // 射的台の幅からはみ出さない範囲
    const player = {
      position: new THREE.Vector3(0, 0, PLAYER_Z),
      facing: 0,          // 向いている方向（Y軸回転、ラジアン）。狙っている方向に合わせる
    };

    // 見た目用のグループ（足元基準で配置するため、カプセル本体は上にずらす）
    const playerMesh = new THREE.Group();
    const capsule = new THREE.Mesh(
      // CapsuleGeometry(半径, 円柱部分の長さ) → 全高 = 長さ + 半径*2
      new THREE.CapsuleGeometry(PLAYER_RADIUS, PLAYER_HEIGHT - PLAYER_RADIUS * 2, 8, 16),
      new THREE.MeshStandardMaterial({ color: 0x2f6fe0 })
    );
    capsule.position.y = PLAYER_HEIGHT / 2;
    capsule.castShadow = true;
    playerMesh.add(capsule);

    // 向きが分かるように、顔の位置に小さな箱を付ける
    const nose = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.2, 0.3),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    nose.position.set(0, PLAYER_HEIGHT * 0.75, PLAYER_RADIUS);
    playerMesh.add(nose);
    scene.add(playerMesh);

    // =========================================================
    // 入力（キーボード）
    // =========================================================
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    // ウィンドウからフォーカスが外れたらキー状態をリセット（押しっぱなし防止）
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    // =========================================================
    // 入力（バーチャルスティック）
    // 左右の移動だけに使うので、ノブも横にだけ動かす。
    // Pointer Events を使い、マルチタッチでも指ごとに管理する
    // =========================================================
    const stickEl = document.getElementById('stick');
    const knobEl = document.getElementById('stick-knob');
    const stick = { x: 0, pointerId: null }; // x: 右が+
    const STICK_RANGE = 50; // ノブが動ける最大距離 [px]

    function updateStick(e) {
      const rect = stickEl.getBoundingClientRect();
      const dx = THREE.MathUtils.clamp(e.clientX - (rect.left + rect.width / 2), -STICK_RANGE, STICK_RANGE);
      knobEl.style.transform = `translate(${dx}px, 0px)`;
      stick.x = dx / STICK_RANGE;
    }

    function resetStick() {
      stick.x = 0;
      stick.pointerId = null;
      knobEl.style.transform = '';
    }

    stickEl.addEventListener('pointerdown', (e) => {
      if (stick.pointerId !== null) return;
      stick.pointerId = e.pointerId;
      // 指がスティックの外に出ても追従し続けるようにキャプチャする
      stickEl.setPointerCapture(e.pointerId);
      updateStick(e);
      e.preventDefault();
    });
    stickEl.addEventListener('pointermove', (e) => {
      if (e.pointerId === stick.pointerId) updateStick(e);
    });
    const endStick = (e) => { if (e.pointerId === stick.pointerId) resetStick(); };
    stickEl.addEventListener('pointerup', endStick);
    stickEl.addEventListener('pointercancel', endStick);

    // =========================================================
    // 矢
    // 細い円柱＋先端の円錐。+Z 方向が先端になるよう形状を回転させておき、
    // 発射時に「+Z を飛ぶ方向へ向ける回転」をかけて向きを合わせる。
    // =========================================================
    const ARROW_LENGTH = 0.8;
    const arrowShaftGeometry = new THREE.CylinderGeometry(0.03, 0.03, ARROW_LENGTH, 6);
    arrowShaftGeometry.rotateX(Math.PI / 2); // 円柱の軸を Y → Z に向ける
    const arrowTipGeometry = new THREE.ConeGeometry(0.07, 0.18, 8);
    arrowTipGeometry.rotateX(Math.PI / 2);   // 円錐の先端を +Z に向ける
    arrowTipGeometry.translate(0, 0, ARROW_LENGTH / 2 + 0.09);
    const arrowShaftMaterial = new THREE.MeshStandardMaterial({ color: 0x8a6a40 });
    const arrowTipMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd });

    const arrows = [];      // 飛んでいる矢 { mesh, dir, life, reflections, hitTargets }
    let shootCooldown = 0;  // 次に撃てるまでの残り時間

    // 今撃ったら矢がどう飛び出すかを計算する（予測線と実際の射撃で共通）
    // 戻り値：{ aim: 照準の情報, dir: 飛ぶ向き, position: 矢の中心の初期位置, tip: 矢の先端の初期位置 }
    function computeShot() {
      // 胸の高さから、照準の先に見えている地点へ向けて撃つ（自動の狙い補正はしない）
      const aim = computeAim();
      const origin = player.position.clone();
      origin.y += ARROW_HEIGHT;
      const dir = aim.point.clone().sub(origin);
      // 狙う地点が近すぎる（足元などを狙った）ときは、向きが不安定になるのでカメラの視線方向へ撃つ
      if (dir.length() < 1.5) dir.copy(aim.rayDir);
      dir.normalize();
      // 体の表面あたりから撃ち出す（中心から出すと見た目がめり込むため）
      const position = origin.addScaledVector(dir, PLAYER_RADIUS);
      const tip = position.clone().addScaledVector(dir, ARROW_TIP_OFFSET);
      return { aim, dir, position, tip };
    }

    // 矢を1本撃つ（ゲーム中でない・矢が残っていない・クールダウン中なら何もしない）
    function shoot() {
      if (game.state !== 'playing' || game.arrowsLeft <= 0 || shootCooldown > 0) return;
      shootCooldown = SHOOT_COOLDOWN;
      game.arrowsLeft--;
      refreshHud();
      playSound('shoot');

      const { dir, position, tip } = computeShot();

      const mesh = new THREE.Group();
      mesh.add(new THREE.Mesh(arrowShaftGeometry, arrowShaftMaterial));
      mesh.add(new THREE.Mesh(arrowTipGeometry, arrowTipMaterial));
      mesh.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);
      mesh.position.copy(position);
      scene.add(mesh);
      arrows.push({
        mesh,
        dir,
        life: ARROW_LIFETIME,
        reflections: 0,        // 鏡で反射した回数
        hitTargets: new Set(), // この矢がすでに割った風船（同じ風船に2回当たらないように）
        points: 0,             // この矢で取った点数（ボーナス込み）
        trail: createTrail(tip), // 光の尾
        sinceCorner: 0,        // 発射・最後の反射から進んだ距離（尾の描き方に使う）
      });
    }
    const ARROW_FORWARD = new THREE.Vector3(0, 0, 1); // 矢のモデルの先端方向

    // =========================================================
    // 照準
    // =========================================================
    const crosshairEl = document.getElementById('crosshair');
    crosshairEl.style.top = `${(0.5 - CROSSHAIR_RAISE) * 100}%`;
    // 照準の位置をカメラの画面座標（-1〜1、上が+）で表したもの
    const CROSSHAIR_NDC = new THREE.Vector2(0, CROSSHAIR_RAISE * 2);
    const aimRaycaster = new THREE.Raycaster();

    // レイ（origin から dir 方向）と箱の交差判定（スラブ法）。
    // tMin〜tMax の範囲で当たれば、その距離を返す。当たらなければ null
    function rayBox(origin, dir, box, tMin, tMax) {
      for (const axis of ['x', 'y', 'z']) {
        const o = origin[axis], d = dir[axis];
        if (Math.abs(d) < 1e-9) {
          // この軸に平行なレイ：箱の範囲外なら当たらない
          if (o < box.min[axis] || o > box.max[axis]) return null;
          continue;
        }
        let t1 = (box.min[axis] - o) / d;
        let t2 = (box.max[axis] - o) / d;
        if (t1 > t2) [t1, t2] = [t2, t1];
        tMin = Math.max(tMin, t1);
        tMax = Math.min(tMax, t2);
        if (tMin > tMax) return null;
      }
      return tMin;
    }

    // レイと鏡（回転した箱）の交差判定。鏡のローカル座標に変換してから箱と同じ方法で調べる
    const localOrigin = new THREE.Vector3();
    const localDir = new THREE.Vector3();
    function rayMirror(origin, dir, mirror, tMin, tMax) {
      toMirrorLocal(mirror, origin, localOrigin);
      toMirrorLocal(mirror, dir, localDir, true);
      return rayBox(localOrigin, localDir, mirror.localBox, tMin, tMax);
    }

    // レイが最初に当たる物（地形・鏡）を探す。鏡に当たったときは mirror が入る
    // （風船は矢が貫通するので、ここでは調べない）
    function raycastColliders(origin, dir, tMin, tMax) {
      let best = null;
      for (const box of colliders) {
        const t = rayBox(origin, dir, box, tMin, best ? best.t : tMax);
        if (t !== null) best = { box, t };
      }
      for (const mirror of mirrors) {
        const t = rayMirror(origin, dir, mirror, tMin, best ? best.t : tMax);
        if (t !== null) best = { mirror, t };
      }
      return best;
    }

    // 今の照準で「どこを狙っているか」を計算する
    // 戻り値：{ point: 照準の先に見えている地点, rayDir: カメラの視線方向, onTarget: 照準に重なっている風船 }
    function computeAim() {
      camera.updateMatrixWorld(); // 描画前でも最新のカメラ位置・向きで計算する
      aimRaycaster.setFromCamera(CROSSHAIR_NDC, camera);
      const camPos = aimRaycaster.ray.origin;
      const rayDir = aimRaycaster.ray.direction;

      // カメラとプレイヤーの間にある物は無視したいので、
      // 「レイ上でプレイヤーの胸に一番近い点」から先だけを調べる
      const chest = player.position.clone();
      chest.y += ARROW_HEIGHT;
      const tStart = Math.max(0, chest.sub(camPos).dot(rayDir));

      const hit = raycastColliders(camPos, rayDir, tStart, AIM_FAR_DISTANCE);
      let hitT = hit ? hit.t : AIM_FAR_DISTANCE;
      // 地形や鏡より手前に風船が見えていれば、照準はその風船に重なっている
      let onTarget = null;
      for (const balloon of balloons) {
        if (balloon.state !== 'alive') continue;
        const t = rayBalloon(camPos, rayDir, balloon, tStart, hitT);
        if (t !== null) { hitT = t; onTarget = balloon; }
      }
      const point = camPos.clone().addScaledVector(rayDir, hitT);
      return { point, rayDir: rayDir.clone(), onTarget };
    }

    // 点が箱の中に入っているか
    function pointInBox(p, box) {
      return p.x >= box.min.x && p.x <= box.max.x &&
             p.y >= box.min.y && p.y <= box.max.y &&
             p.z >= box.min.z && p.z <= box.max.z;
    }

    // 矢の中心から先端までの距離
    const ARROW_TIP_OFFSET = ARROW_LENGTH / 2 + 0.18;

    // 矢の先端が、このフレームで鏡に当たったかを調べる。
    // prevTip → tip の線分と鏡の交差を求め、一番手前で当たった鏡を返す
    const segmentDir = new THREE.Vector3();
    const hitLocal = new THREE.Vector3();
    function findMirrorHit(prevTip, tip) {
      segmentDir.subVectors(tip, prevTip);
      const length = segmentDir.length();
      if (length < 1e-9) return null;
      segmentDir.divideScalar(length);
      let best = null;
      for (const mirror of mirrors) {
        const t = rayMirror(prevTip, segmentDir, mirror, 0, best ? best.t : length);
        if (t === null) continue;
        // 当たった点が鏡の「面」なら反射、「木の枠」なら壁と同じ扱い
        const point = prevTip.clone().addScaledVector(segmentDir, t);
        toMirrorLocal(mirror, point, hitLocal);
        const onFace = isMirrorFace(hitLocal);
        best = { mirror, t, point, onFace, remaining: length - t };
      }
      return best;
    }

    // 矢を消す。1つ以上の風船を割っていたら「×N HIT!」を表示する。光の尾は薄くしながら消していく
    function removeArrow(index) {
      const a = arrows[index];
      scene.remove(a.mesh);
      arrows.splice(index, 1);
      fadingTrails.push({ trail: a.trail, time: TRAIL_FADE_TIME });
      if (a.hitTargets.size > 0) showHitCount(a.hitTargets.size, a.points);
    }

    // 矢が飛んでいてよい範囲（射的場のまわり）。この外へ出た矢はすぐ消す
    const stageBox = {
      min: new THREE.Vector3(-AREA_HALF_WIDTH - 1, -Infinity, -5),
      max: new THREE.Vector3(AREA_HALF_WIDTH + 1, WALL_HEIGHT + 4, AREA_BACK_Z + 1),
    };
    // 点が射的場の外にあるか
    function isOutsideStage(p) {
      return p.x < stageBox.min.x || p.x > stageBox.max.x || p.z < stageBox.min.z || p.z > stageBox.max.z ||
             p.y > stageBox.max.y;
    }

    // =========================================================
    // 光の尾（矢の軌跡）
    // 発射位置 → 反射した点 → … → 今の矢の後ろ、を結ぶ折れ線として描く。
    // 加算合成で光って見えるようにし、矢が消えたら1秒かけて薄くして消す。
    // =========================================================
    const TRAIL_MAX_POINTS = ARROW_MAX_REFLECTIONS + 2; // 発射位置＋反射点＋今の位置
    const fadingTrails = []; // 消えかけの尾 { trail, time }

    function createTrail(start) {
      const positions = new Float32Array(TRAIL_MAX_POINTS * 3);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({
        color: 0xffe9a0,
        transparent: true,
        opacity: TRAIL_OPACITY,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const line = new THREE.Line(geometry, material);
      line.frustumCulled = false; // 頂点を毎フレーム書き換えるので、画面外判定で消えないようにする
      scene.add(line);
      const trail = { line, positions, count: 1 };
      positions.set([start.x, start.y, start.z], 0);
      setTrailHead(trail, start);
      return trail;
    }

    // 折れ線の最後の点（今の矢の後ろ）を更新する
    function setTrailHead(trail, p) {
      trail.positions.set([p.x, p.y, p.z], trail.count * 3);
      trail.line.geometry.setDrawRange(0, trail.count + 1);
      trail.line.geometry.attributes.position.needsUpdate = true;
    }

    // 反射した点を折れ線の曲がり角として確定させる
    function addTrailCorner(trail, p) {
      if (trail.count + 1 >= TRAIL_MAX_POINTS) return;
      trail.positions.set([p.x, p.y, p.z], trail.count * 3);
      trail.count++;
      setTrailHead(trail, p);
    }

    // 消えかけの尾を薄くしていき、透明になったら取り除く
    function updateFadingTrails(dt) {
      for (let i = fadingTrails.length - 1; i >= 0; i--) {
        const f = fadingTrails[i];
        f.time -= dt;
        if (f.time > 0) {
          f.trail.line.material.opacity = TRAIL_OPACITY * (f.time / TRAIL_FADE_TIME);
          continue;
        }
        scene.remove(f.trail.line);
        f.trail.line.geometry.dispose();
        f.trail.line.material.dispose();
        fadingTrails.splice(i, 1);
      }
    }

    // 矢の移動・鏡での反射・命中判定
    const arrowTip = new THREE.Vector3();
    const prevTip = new THREE.Vector3();
    const trailHead = new THREE.Vector3();
    function updateArrows(dt) {
      shootCooldown = Math.max(0, shootCooldown - dt);

      for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        // 重力なしで、今の向きにまっすぐ進む
        prevTip.copy(a.mesh.position).addScaledVector(a.dir, ARROW_TIP_OFFSET);
        a.mesh.position.addScaledVector(a.dir, ARROW_SPEED * dt);
        arrowTip.copy(a.mesh.position).addScaledVector(a.dir, ARROW_TIP_OFFSET);
        a.life -= dt;
        a.sinceCorner += ARROW_SPEED * dt;

        // ---- 鏡 ----
        const mirrorHit = findMirrorHit(prevTip, arrowTip);
        if (mirrorHit) {
          // 鏡の木の枠に当たった、または反射回数の上限を超えたら消える
          if (!mirrorHit.onFace || a.reflections >= ARROW_MAX_REFLECTIONS) {
            removeArrow(i);
            continue;
          }
          // 反射：入射角＝反射角になるよう、面の向き（法線）成分だけを反転する
          //   r = d - 2 (d・n) n   （上下方向の成分もこの式でそのまま正しく扱われる）
          const n = mirrorHit.mirror.normal;
          a.dir.addScaledVector(n, -2 * a.dir.dot(n)).normalize();
          a.reflections++;
          playSound('reflect');
          // 鏡に当たった点から、このフレームで進み残した距離だけ新しい向きへ進める
          arrowTip.copy(mirrorHit.point).addScaledVector(a.dir, mirrorHit.remaining);
          a.mesh.position.copy(arrowTip).addScaledVector(a.dir, -ARROW_TIP_OFFSET);
          a.mesh.quaternion.setFromUnitVectors(ARROW_FORWARD, a.dir);
          // 光の尾：反射した点を曲がり角にする
          addTrailCorner(a.trail, mirrorHit.point);
          a.sinceCorner = mirrorHit.remaining;
        }

        // 光の尾の先端は矢の後ろ端に合わせる（反射直後は曲がり角より手前に戻らないようにする）
        trailHead.copy(arrowTip).addScaledVector(a.dir, -Math.min(a.sinceCorner, ARROW_TIP_OFFSET + ARROW_LENGTH / 2));
        setTrailHead(a.trail, trailHead);

        // ---- 風船・地形 ----
        // 先端の位置で当たり判定（細かい時間刻みで更新しているので、すり抜けにくい）
        // 風船は貫通する：まだ当たっていない風船なら割り、矢はそのまま進む
        for (const balloon of balloons) {
          if (balloon.state !== 'alive' || a.hitTargets.has(balloon)) continue;
          if (!pointInBalloon(arrowTip, balloon)) continue;
          a.hitTargets.add(balloon);
          popBalloon(balloon);
          // 点数：風船の点 ＋ この矢で何個目か（2個目以降はボーナス）
          const points = (balloon.motion ? SCORE_GOLD : SCORE_NORMAL) + (a.hitTargets.size - 1) * MULTI_HIT_BONUS;
          a.points += points;
          addScore(points, a.hitTargets.size);
        }
        const hitWall = colliders.some((box) => pointInBox(arrowTip, box)); // 床・射的台・衝立・壁

        // 鏡以外に当たった、寿命が尽きた、または射的場の外へ出たら消す
        if (hitWall || a.life <= 0 || isOutsideStage(arrowTip)) removeArrow(i);
      }
    }

    // =========================================================
    // 撃つ前の予測線
    // 照準の方向へ撃ったときの軌道を、GUIDE_REFLECTIONS 回目の反射までと、
    // その反射直後の短い線（GUIDE_AFTER_LENGTH）だけ薄く表示する。
    // 風船は貫通するので無視し、床・射的台・衝立・壁・鏡の木の枠・射的場の外で線を止める。
    // =========================================================
    const GUIDE_MAX_POINTS = GUIDE_REFLECTIONS + 2;
    const guidePositions = new Float32Array(GUIDE_MAX_POINTS * 3);
    const guideGeometry = new THREE.BufferGeometry();
    guideGeometry.setAttribute('position', new THREE.BufferAttribute(guidePositions, 3));
    const guideLine = new THREE.Line(guideGeometry, new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: GUIDE_OPACITY,
      depthWrite: false,
    }));
    guideLine.frustumCulled = false;
    scene.add(guideLine);

    // レイが射的場の外へ出るまでの距離（stageBox の出口）
    function distanceToStageExit(origin, dir) {
      let tExit = Infinity;
      for (const axis of ['x', 'y', 'z']) {
        const d = dir[axis];
        if (Math.abs(d) < 1e-9) continue;
        const bound = d > 0 ? stageBox.max[axis] : stageBox.min[axis];
        tExit = Math.min(tExit, (bound - origin[axis]) / d);
      }
      return Math.max(0, tExit);
    }

    // 予測線の頂点を計算して書き込む。shot は computeShot() の結果
    const guideHitLocal = new THREE.Vector3();
    function updateGuide(shot) {
      const pos = shot.tip.clone();
      const dir = shot.dir.clone();
      let count = 0;
      const push = (p) => { guidePositions.set([p.x, p.y, p.z], count * 3); count++; };
      push(pos);

      for (let reflections = 0; ; reflections++) {
        const maxDist = distanceToStageExit(pos, dir);
        const hit = raycastColliders(pos, dir, 1e-4, maxDist);
        if (!hit) { push(pos.addScaledVector(dir, maxDist)); break; } // マップの外まで何もない
        pos.addScaledVector(dir, hit.t);
        push(pos);
        if (!hit.mirror) break; // 床・射的台・衝立・壁に当たったらそこで終わり

        // 鏡の木の枠なら矢はそこで消えるので、線もそこで終わり
        toMirrorLocal(hit.mirror, pos, guideHitLocal);
        if (!isMirrorFace(guideHitLocal)) break;
        if (reflections >= GUIDE_REFLECTIONS) break; // 見せる反射回数を使い切ったら終わり

        // 反射させる
        const n = hit.mirror.normal;
        dir.addScaledVector(n, -2 * dir.dot(n)).normalize();
        if (reflections + 1 >= GUIDE_REFLECTIONS) {
          // 最後に見せる反射：その直後の短い線だけ描く（途中で何かに当たればそこまで）
          const end = raycastColliders(pos, dir, 1e-4, GUIDE_AFTER_LENGTH);
          push(pos.clone().addScaledVector(dir, end ? end.t : GUIDE_AFTER_LENGTH));
          break;
        }
      }
      guideGeometry.setDrawRange(0, count);
      guideGeometry.attributes.position.needsUpdate = true;
    }

    // 「×N HIT! +点数」を画面中央に1秒表示する
    const hitPopupEl = document.getElementById('hit-popup');
    function showHitCount(count, points) {
      hitPopupEl.textContent = `×${count} HIT! +${points}`;
      // アニメーションを最初からやり直すため、一度クラスを外して再計算させてから付け直す
      hitPopupEl.classList.remove('show');
      void hitPopupEl.offsetWidth;
      hitPopupEl.classList.add('show');
    }
    hitPopupEl.addEventListener('animationend', () => hitPopupEl.classList.remove('show'));

    // =========================================================
    // 入力（射撃）
    // スマホ：SHOOT ボタン／PC：マウス右クリック または F キー
    // （マウス左ドラッグは視点操作なので、射撃は右クリックに分けている）
    // =========================================================
    const shootEl = document.getElementById('shoot');
    shootEl.addEventListener('pointerdown', (e) => {
      shoot();
      shootEl.classList.add('pressed');
      e.preventDefault();
    });
    const releaseShoot = () => shootEl.classList.remove('pressed');
    shootEl.addEventListener('pointerup', releaseShoot);
    shootEl.addEventListener('pointercancel', releaseShoot);
    shootEl.addEventListener('pointerleave', releaseShoot);

    window.addEventListener('keydown', (e) => {
      // キーの押しっぱなしによる自動リピートでは撃たない（1回押すごとに1本）
      if (e.code === 'KeyF' && !e.repeat) shoot();
    });
    // 右クリック。左ドラッグ中でも撃てるよう、pointerdown ではなく mousedown で拾う
    // （左ボタンを押したまま右ボタンを押しても pointerdown は発生しないため）
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 2) shoot();
    });

    // =========================================================
    // 効果音のON/OFFボタン（右上）
    // =========================================================
    const soundEl = document.getElementById('sound');
    const refreshSoundButton = () => { soundEl.textContent = sound.enabled ? '🔊' : '🔇'; };
    refreshSoundButton();
    soundEl.addEventListener('pointerdown', (e) => {
      sound.enabled = !sound.enabled;
      try { localStorage.setItem('bow-action-sound', sound.enabled ? 'on' : 'off'); } catch (err) { /* 何もしない */ }
      refreshSoundButton();
      e.preventDefault();
    });

    // 長押しメニューなどが出ないようにする
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // iOS Safari のピンチズーム・ダブルタップズームを止める（touch-action だけでは効かない場合の保険）
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', (e) => e.preventDefault());

    // =========================================================
    // 入力（狙いのドラッグ）
    // スティックとSHOOTボタン以外（＝キャンバス）をドラッグすると狙う向きが変わる。
    // 左右は正面から ±AIM_YAW_LIMIT 度、上下は水平から ±AIM_PITCH_LIMIT 度まで。
    // スティックとは別の指（pointerId）として扱うので、左手移動＋右手狙いが同時にできる。
    // PCではマウスの左ドラッグで同じように動かせる。
    // =========================================================
    let cameraYaw = 0;    // 狙いの左右の角度（0 で正面 = +Z 方向。プラスで左）
    let cameraPitch = 0;  // 狙いの上下の角度（0 で水平。プラスで見上げる）
    const AIM_YAW_MAX = THREE.MathUtils.degToRad(AIM_YAW_LIMIT);
    const AIM_PITCH_MAX = THREE.MathUtils.degToRad(AIM_PITCH_LIMIT);
    const look = { pointerId: null, lastX: 0, lastY: 0 };
    const canvasEl = renderer.domElement;

    canvasEl.addEventListener('pointerdown', (e) => {
      if (look.pointerId !== null) return;          // 狙いの操作はひとつの指だけで行う
      if (game.state !== 'playing') return;         // ゲーム中だけ狙いを動かせる
      if (e.pointerType === 'mouse' && e.button !== 0) return; // マウスは左ボタンのみ
      look.pointerId = e.pointerId;
      look.lastX = e.clientX;
      look.lastY = e.clientY;
      canvasEl.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    canvasEl.addEventListener('pointermove', (e) => {
      if (e.pointerId !== look.pointerId) return;
      const dx = e.clientX - look.lastX;
      const dy = e.clientY - look.lastY;
      look.lastX = e.clientX;
      look.lastY = e.clientY;
      if (dx === 0 && dy === 0) return;
      // 右へドラッグ → 右を向く（yaw が減る方向が右回り）
      cameraYaw = THREE.MathUtils.clamp(cameraYaw - dx * CAMERA_YAW_SENSITIVITY, -AIM_YAW_MAX, AIM_YAW_MAX);
      // 上へドラッグ → 見上げる。反転設定にも対応
      const pitchDelta = -dy * CAMERA_PITCH_SENSITIVITY * (CAMERA_INVERT_Y ? -1 : 1);
      cameraPitch = THREE.MathUtils.clamp(cameraPitch + pitchDelta, -AIM_PITCH_MAX, AIM_PITCH_MAX);
    });
    const endLook = (e) => { if (e.pointerId === look.pointerId) look.pointerId = null; };
    canvasEl.addEventListener('pointerup', endLook);
    canvasEl.addEventListener('pointercancel', endLook);
    canvasEl.addEventListener('lostpointercapture', endLook);

    // 左右の移動入力を -1〜1 で取得する（右が+）。キー入力が無ければスティックの値を使う
    function getMoveInput() {
      let x = 0;
      if (keys['KeyD'] || keys['ArrowRight']) x += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
      return x !== 0 ? x : stick.x;
    }

    // =========================================================
    // ゲームの更新処理
    // =========================================================
    function update(dt) {
      // 射的台の後ろを左右にだけ動く。奥（+Z）を向いたとき画面の右は -X 方向
      const input = getMoveInput();
      player.position.x = THREE.MathUtils.clamp(
        player.position.x - input * MOVE_SPEED * dt, -PLAYER_X_LIMIT, PLAYER_X_LIMIT);
      // 体は狙っている向きに合わせる
      player.facing = cameraYaw;
    }

    // =========================================================
    // カメラ：プレイヤーの後ろ（少し右の肩越し）から、狙っている向きを見る
    // 左右の移動にはふんわり追従し、狙いの角度は即座に反映する。
    // =========================================================
    const cameraFocus = new THREE.Vector3(); // カメラの基準点（プレイヤーの頭の後ろあたり。滑らかに追従）
    const focusGoal = new THREE.Vector3();
    const lookTarget = new THREE.Vector3();

    function updateCamera(dt, snap = false) {
      const p = player.position;
      focusGoal.set(p.x, p.y + CAMERA_HEIGHT, p.z);
      if (snap) cameraFocus.copy(focusGoal);
      else cameraFocus.lerp(focusGoal, 1 - Math.exp(-CAMERA_SMOOTH * dt));

      // 前方向（水平）と右方向。奥（+Z）を向いたとき、画面の右は -X
      const fx = Math.sin(cameraYaw), fz = Math.cos(cameraYaw);
      const rx = -Math.cos(cameraYaw), rz = Math.sin(cameraYaw);
      camera.position.set(
        cameraFocus.x - fx * CAMERA_DISTANCE + rx * CAMERA_SHOULDER,
        cameraFocus.y,
        cameraFocus.z - fz * CAMERA_DISTANCE + rz * CAMERA_SHOULDER
      );
      // 狙っている向き（上下も含む）を見る
      const cp = Math.cos(cameraPitch);
      lookTarget.set(fx * cp, Math.sin(cameraPitch), fz * cp).add(camera.position);
      camera.lookAt(lookTarget);
    }

    // =========================================================
    // ゲームの流れ：タイトル → カウントダウン → ゲーム中 → リザルト
    // =========================================================
    const game = {
      state: 'title',     // 'title' / 'countdown' / 'playing' / 'result'
      arrowsLeft: ARROW_COUNT,
      timeLeft: TIME_LIMIT,
      score: 0,
      popped: 0,          // 割った風船の数
      maxMulti: 0,        // 1本で同時に割った最大数
      countdownTime: 0,   // カウントダウン開始からの経過時間
      countdownStep: -1,  // 今表示しているカウントダウンの段階（0:「3」〜 3:「スタート！」）
      lastSecond: 0,      // 前回表示した残り秒数（毎秒の「ピッ」に使う）
    };

    // ベストスコアの読み書き（保存できない環境でも動くよう try で囲む）
    function loadBestScore() {
      try { return Number(localStorage.getItem(BEST_SCORE_KEY)) || 0; } catch (e) { return 0; }
    }
    function saveBestScore(score) {
      try { localStorage.setItem(BEST_SCORE_KEY, String(score)); } catch (e) { /* 何もしない */ }
    }
    let bestScore = loadBestScore();

    const titleScreenEl = document.getElementById('title-screen');
    const resultScreenEl = document.getElementById('result-screen');
    const countdownEl = document.getElementById('countdown');
    const hudArrowsEl = document.getElementById('hud-arrows');
    const hudTimeEl = document.getElementById('hud-time');
    const hudScoreEl = document.getElementById('hud-score');

    // 状態を切り替え、それに合わせて画面の表示を変える
    function setState(state) {
      game.state = state;
      document.body.dataset.state = state; // CSS でぼかし・操作ボタンの表示を切り替える
      titleScreenEl.classList.toggle('show', state === 'title');
      resultScreenEl.classList.toggle('show', state === 'result');
      guideLine.visible = state === 'playing';
      resetStick();
      look.pointerId = null;
    }

    // 上部の表示（残りの矢・残り時間・スコア）を更新する
    function refreshHud() {
      hudArrowsEl.textContent = game.arrowsLeft;
      hudTimeEl.textContent = Math.ceil(game.timeLeft);
      hudTimeEl.classList.toggle('warning', game.timeLeft <= WARNING_TIME);
      hudScoreEl.textContent = game.score;
    }

    // 風船を割ったときに点数を足す（hitIndex はその矢で何個目か）
    function addScore(points, hitIndex) {
      if (game.state !== 'playing') return;
      game.score += points;
      game.popped++;
      game.maxMulti = Math.max(game.maxMulti, hitIndex);
      refreshHud();
    }

    // 1ゲーム分の状態を完全に最初に戻す（風船の配置・動きの時間・矢・プレイヤーの位置と向き）
    function resetRound() {
      game.arrowsLeft = ARROW_COUNT;
      game.timeLeft = TIME_LIMIT;
      game.score = 0;
      game.popped = 0;
      game.maxMulti = 0;
      game.lastSecond = TIME_LIMIT;
      // 飛んでいる矢と光の尾を消す（「×N HIT!」は出さない）
      for (const a of arrows) {
        scene.remove(a.mesh, a.trail.line);
        a.trail.line.geometry.dispose();
        a.trail.line.material.dispose();
      }
      arrows.length = 0;
      for (const f of fadingTrails) {
        scene.remove(f.trail.line);
        f.trail.line.geometry.dispose();
        f.trail.line.material.dispose();
      }
      fadingTrails.length = 0;
      hitPopupEl.classList.remove('show');
      // 風船を全部元に戻し、動きの時間も 0 に戻す（毎回まったく同じ動きから始まる）
      for (const balloon of balloons) {
        balloon.state = 'alive';
        balloon.group.visible = true;
      }
      balloonRespawnTimer = 0;
      gameTime = 0;
      // プレイヤーと狙いを正面に戻す
      player.position.x = 0;
      cameraYaw = 0;
      cameraPitch = 0;
      shootCooldown = 0;
      updateCamera(0, true);
      refreshHud();
    }

    // スタート：カウントダウンを始める
    function startCountdown() {
      resetRound();
      game.countdownTime = 0;
      game.countdownStep = -1;
      setState('countdown');
    }

    // カウントダウンの文字を出す（毎回アニメーションを最初からやり直す）
    function showCountdown(text) {
      countdownEl.textContent = text;
      countdownEl.classList.remove('show');
      void countdownEl.offsetWidth;
      countdownEl.classList.add('show');
    }
    countdownEl.addEventListener('animationend', () => countdownEl.classList.remove('show'));

    // ゲーム終了：リザルト画面を出し、ベストスコアを更新する
    function endGame() {
      // 時間切れのときに飛んでいた矢は消す（点数には入れない）
      for (const a of arrows) {
        scene.remove(a.mesh);
        fadingTrails.push({ trail: a.trail, time: TRAIL_FADE_TIME });
      }
      arrows.length = 0;

      const isNewRecord = game.score > bestScore;
      if (isNewRecord) {
        bestScore = game.score;
        saveBestScore(bestScore);
      }
      document.getElementById('result-score').firstChild.textContent = game.score;
      document.getElementById('result-popped').textContent = `${game.popped}個`;
      document.getElementById('result-multi').textContent = `×${game.maxMulti}`;
      document.getElementById('result-best').textContent = `${bestScore}点`;
      document.getElementById('new-record').classList.toggle('show', isNewRecord);
      document.getElementById('title-best').textContent = bestScore;
      setState('result');
    }

    // 状態ごとの毎フレームの処理
    const COUNTDOWN_TEXTS = ['3', '2', '1', 'スタート！'];
    function updateGame(dt) {
      if (game.state === 'countdown') {
        game.countdownTime += dt;
        const step = Math.floor(game.countdownTime / COUNTDOWN_STEP);
        if (step !== game.countdownStep) {
          game.countdownStep = step;
          showCountdown(COUNTDOWN_TEXTS[step]);
          // 「スタート！」が出た瞬間からゲーム開始
          if (step >= 3) {
            playSound('beepStart');
            setState('playing');
          } else {
            playSound('beep');
          }
        }
        return;
      }

      if (game.state === 'playing') {
        game.timeLeft = Math.max(0, game.timeLeft - dt);
        // 残り時間わずか：秒が変わるたびに「ピッ」
        const second = Math.ceil(game.timeLeft);
        if (second !== game.lastSecond) {
          game.lastSecond = second;
          if (second <= WARNING_TIME && second > 0) playSound('beep');
        }
        refreshHud();
        // 時間切れ、または矢を全部撃ち終えて最後の矢が消えたら終了
        if (game.timeLeft <= 0 || (game.arrowsLeft === 0 && arrows.length === 0)) endGame();
      }
    }

    document.getElementById('start-btn').addEventListener('click', startCountdown);
    document.getElementById('retry-btn').addEventListener('click', startCountdown);
    document.getElementById('to-title-btn').addEventListener('click', () => setState('title'));
    document.getElementById('title-best').textContent = bestScore;

    // =========================================================
    // メインループ
    // =========================================================
    const clock = new THREE.Clock();
    const MAX_SUBSTEP = 1 / 120; // 高速移動ですり抜けないよう、細かく分割して更新

    updateCamera(0, true);
    setState('title');

    function loop() {
      // タブ復帰時などに巨大な dt が来ても暴れないよう上限を設ける
      const dt = Math.min(clock.getDelta(), 0.1);
      const steps = Math.ceil(dt / MAX_SUBSTEP);
      for (let i = 0; i < steps; i++) {
        if (game.state === 'playing') update(dt / steps); // プレイヤーが動けるのはゲーム中だけ
        updateArrows(dt / steps);
      }
      // カウントダウン中は風船の動きを止めておき、「スタート！」から動きの時間を進める
      updateBalloons(dt, game.state === 'countdown' ? 0 : dt);
      updateGame(dt);
      shootEl.classList.toggle('cooling', shootCooldown > 0 || game.arrowsLeft <= 0);

      // 見た目を物理状態に合わせる
      playerMesh.position.copy(player.position);
      playerMesh.rotation.y = player.facing;

      updateCamera(dt);
      // ゲーム中は、照準が風船に重なっていれば照準を赤くし、予測線を更新する
      if (game.state === 'playing') {
        const shot = computeShot();
        crosshairEl.classList.toggle('on-target', !!shot.aim.onTarget);
        updateGuide(shot);
      }
      updateFadingTrails(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    loop();

    // 画面サイズ変更（スマホの回転含む）に対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
