<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでピンチズームやダブルタップ拡大が起きないようにする -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- 古いバージョンがキャッシュから表示され続けないよう、index.html をキャッシュさせない指定 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>3Dアクション試作（グレーボックス）</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #87a9c9;
      /* スマホでのスクロール・長押し選択・タップハイライトを無効化 */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: sans-serif;
    }
    /* ドラッグで視点を回すため、キャンバス上でもスクロール・ズームを無効化 */
    canvas { display: block; touch-action: none; }

    /* ===== バーチャルスティック（左下） ===== */
    #stick {
      position: fixed;
      left: calc(24px + env(safe-area-inset-left));
      bottom: calc(24px + env(safe-area-inset-bottom));
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.5);
      touch-action: none;
    }
    #stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    /* ===== ジャンプボタン（右下） ===== */
    #jump {
      position: fixed;
      right: calc(32px + env(safe-area-inset-right));
      bottom: calc(40px + env(safe-area-inset-bottom));
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #jump.pressed { background: rgba(255, 255, 255, 0.55); }

    /* ===== 射撃ボタン（JUMPボタンの左上） ===== */
    #shoot {
      position: fixed;
      right: calc(132px + env(safe-area-inset-right));
      bottom: calc(116px + env(safe-area-inset-bottom));
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 120, 90, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transition: opacity 0.1s;
    }
    #shoot.pressed { background: rgba(255, 120, 90, 0.6); }
    /* クールダウン中は薄く表示して、まだ撃てないことを伝える */
    #shoot.cooling { opacity: 0.45; }

    /* ===== 照準（＋マーク）。縦位置は JS で CROSSHAIR_RAISE から決める ===== */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      --crosshair-color: rgba(255, 255, 255, 0.9);
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: var(--crosshair-color);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.7);
    }
    #crosshair::before { left: -9px; top: -1px; width: 18px; height: 2px; } /* 横棒 */
    #crosshair::after  { left: -1px; top: -9px; width: 2px; height: 18px; } /* 縦棒 */
    /* 照準が的に重なっているときは赤くする */
    #crosshair.on-target { --crosshair-color: #ff3030; }

    /* ===== 1本の矢で抜いた的の数（「×3 HIT!」）を画面中央に表示 ===== */
    #hit-popup {
      position: fixed;
      left: 50%;
      top: 32%;
      transform: translate(-50%, -50%);
      color: #ffe14d;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow: 0 2px 0 #b34700, 0 0 10px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      display: none;
    }
    #hit-popup.show {
      display: block;
      animation: hit-pop 1s ease-out forwards;
    }
    /* ポンと大きく出て、最後にふわっと消える */
    @keyframes hit-pop {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      12%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      25%  { transform: translate(-50%, -50%) scale(1); }
      75%  { opacity: 1; }
      100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
    }

    /* 効果音のON/OFFボタン（右上、バージョン表示の下） */
    #sound {
      position: fixed;
      right: calc(8px + env(safe-area-inset-right));
      top: calc(26px + env(safe-area-inset-top));
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
    }

    /* バージョン表示（右上）：どのバージョンが読み込まれているか確認する用 */
    #version {
      position: fixed;
      right: calc(10px + env(safe-area-inset-right));
      top: calc(8px + env(safe-area-inset-top));
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    /* 操作説明（左上） */
    #help {
      position: fixed;
      left: 12px;
      right: 50px; /* 右上のバージョン表示と重ならないよう空けておく */
      top: 10px;
      color: #fff;
      font-size: 12px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- バージョン番号：コミットするたびに数字を上げること -->
  <div id="version">v0.9</div>
  <div id="sound">🔊</div>
  <div id="help">移動: スティック / WASD ・ ジャンプ: ボタン / Space ・ 視点: 画面をドラッグ ・ 射撃: ボタン / 右クリック / F ・ 鏡で矢を反射させて的をまとめて射抜こう</div>
  <div id="stick"><div id="stick-knob"></div></div>
  <div id="jump">JUMP</div>
  <div id="shoot">SHOOT</div>
  <div id="crosshair"></div>
  <div id="hit-popup"></div>

  <!-- Three.js を CDN から ES Module として読み込む -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================
    // 調整用パラメータ
    // =========================================================
    const PLAYER_RADIUS = 0.5;      // 主人公（カプセル）の半径
    const PLAYER_HEIGHT = 2.0;      // 主人公の全高（足元〜頭）
    const MOVE_SPEED = 6.0;         // 最大移動速度 [m/s]
    const GRAVITY = 25.0;           // 重力加速度 [m/s^2]
    const JUMP_SPEED = 10.0;        // ジャンプ初速 [m/s]（最高到達点 ≒ 2m）
    const STEP_HEIGHT = 0.35;       // ジャンプなしで自動的に乗り越えられる段差の高さ
    const COYOTE_TIME = 0.1;        // 足場から落ちた直後でもジャンプできる猶予 [秒]
    const JUMP_BUFFER = 0.12;       // 着地直前のジャンプ入力を受け付ける猶予 [秒]
    const FALL_LIMIT = -20;         // この高さより落ちたらリスポーン

    // ---- 鏡と的の配置 ----
    // 鏡：x, z は鏡の中心、y は下端の高さ、yaw は鏡の面が向いている方向 [度]
    //   （0 で +Z 向き、90 で +X 向き。鏡は両面とも反射する）
    const MIRROR_WIDTH = 2.0;       // 鏡の幅 [m]
    const MIRROR_HEIGHT = 2.0;      // 鏡の高さ [m]
    const MIRROR_THICKNESS = 0.1;   // 鏡の厚さ [m]
    const MIRRORS = [
      { x: 10, y: 0, z: 0, yaw: -45 },   // 鏡A：+X 方向へ飛んできた矢を +Z 方向へ曲げる
      { x: 10, y: 0, z: 11, yaw: -135 }, // 鏡B：鏡Aから来た矢を -X 方向へ曲げる
      { x: -12, y: 0, z: 0, yaw: 45 },   // 鏡C：-X 方向へ飛んできた矢を +Z 方向へ曲げる
    ];
    // 的：x, z は中心、y は底面の高さ。中心が胸の高さ（ARROW_HEIGHT）に来るよう宙に浮かせている
    //   スタート地点から +X へ撃つ → 鏡A → 鏡B と反射させると最大6個、
    //   -X へ撃つ → 鏡C で反射させると最大4個まとめて抜ける配置
    const TARGET_SPOTS = [
      [4, 0.8, 0], [7, 0.8, 0],     // スタート → 鏡A の間
      [10, 0.8, 4], [10, 0.8, 7],   // 鏡A → 鏡B の間
      [7, 0.8, 11], [4, 0.8, 11],   // 鏡B の先
      [-6, 0.8, 0],                 // スタート → 鏡C の間
      [-12, 0.8, 4], [-12, 0.8, 8], [-12, 0.8, 12], // 鏡C の先
    ];
    const CAMERA_DISTANCE = 7.5;    // カメラと注視点（主人公の胸あたり）の距離
    const CAMERA_PITCH_INIT = 0.3;  // カメラの上下角度の初期値 [ラジアン]（0で水平、大きいほど見下ろす）
    const CAMERA_PITCH_MIN = -0.25; // 上下角度の下限（マイナスでカメラが下がり、少し見上げられる。地面より下へは CAMERA_MIN_Y で止まる）
    const CAMERA_PITCH_MAX = 1.2;   // 上下角度の上限（約70度。真上から見下ろしすぎない）
    const CAMERA_MIN_Y = 0.3;       // カメラが地面にめり込まないための最低の高さ
    const CAMERA_FOLLOW = 2.5;      // カメラが主人公の背後へ回り込む速さ
    const CAMERA_SMOOTH = 8.0;      // カメラが主人公の移動に追従する滑らかさ（大きいほどキビキビ）
    const CAMERA_YAW_SENSITIVITY = 0.006;   // 横ドラッグ1pxあたりの左右回転量 [ラジアン]
    const CAMERA_PITCH_SENSITIVITY = 0.004; // 縦ドラッグ1pxあたりの上下回転量 [ラジアン]
    const CAMERA_INVERT_Y = false;  // true にすると縦ドラッグの上下を反転
    const MANUAL_CAMERA_HOLD = 2.0; // 手動で回したあと、自動回り込みを止めておく時間 [秒]
    const ARROW_SPEED = 30.0;       // 矢の速さ [m/s]
    const ARROW_LIFETIME = 5.0;     // 矢が消えるまでの時間 [秒]（重力なしでまっすぐ飛び続ける）
    const ARROW_MAX_REFLECTIONS = 5; // 1本の矢が鏡で反射できる最大回数（これを超えて鏡に当たると消える）
    const GUIDE_REFLECTIONS = 1;    // 撃つ前の予測線で見せる反射の回数（その先は反射直後の短い線だけ）
    const GUIDE_AFTER_LENGTH = 1.0; // 最後に見せる反射の直後に描く短い線の長さ [m]
    const GUIDE_OPACITY = 0.35;     // 予測線の濃さ（0〜1）
    const TRAIL_OPACITY = 0.7;      // 飛んでいる矢の光の尾の濃さ（0〜1）
    const TRAIL_FADE_TIME = 1.0;    // 矢が消えてから光の尾が消えるまでの時間 [秒]
    const STAGE_HALF = 30;          // マップの半分の大きさ [m]（地面は 60m 四方）。矢がこの外に出たらすぐ消す
    const STAGE_CEILING = 40;       // 矢がこれより高く飛んだらマップの外とみなして消す [m]
    const ARROW_HEIGHT = 1.3;       // 矢を撃ち出す高さ（足元基準。胸の高さ）
    const CROSSHAIR_RAISE = 0.15;   // 照準を画面中央からどれだけ上に置くか（画面の高さに対する割合）
    const AIM_FAR_DISTANCE = 100;   // 照準の先に何もないとき（空など）に狙う地点までの距離 [m]
    const AIM_ASSIST_ANGLE = 10;    // エイムアシストが効く、照準からの角度 [度]（0でアシストなし）
    const SHOOT_COOLDOWN = 0.4;     // 射撃のクールダウン [秒]（連打防止）
    const TARGET_HP = 1;            // 的のHP（1なら矢が1回当たれば消える）
    const TARGET_FLASH_TIME = 0.1;  // 被弾時に白く光る時間 [秒]
    const TARGET_SHRINK_TIME = 0.3; // HP0になってから縮んで消えるまでの時間 [秒]
    const TARGET_RESPAWN_DELAY = 3.0; // 的が全部消えてから復活するまでの時間 [秒]
    const SE_MASTER_VOLUME = 0.7;   // 効果音全体の音量（0〜1）
    const SE_VOLUMES = {            // 効果音ごとの音量（0〜1、全体音量に掛け合わされる）
      shoot: 0.5,   // 矢を撃つ「ヒュッ」
      hit: 0.8,     // 的に当たる「トッ」
      destroy: 0.6, // 的を倒す「ポンッ」
      jump: 0.35,   // ジャンプ「ピョン」
      land: 0.6,    // 着地「トン」
      reflect: 0.5, // 矢が鏡で反射「キンッ」
    };
    const LAND_SOUND_MIN_SPEED = 4.0; // この落下速度 [m/s] 以上で着地したときだけ着地音を鳴らす

    // =========================================================
    // 効果音（Web Audio API で音をその場で合成する。音声ファイルは使わない）
    //
    // 音割れ対策：
    //  ・全ての音を マスター音量 → コンプレッサー（リミッター代わり）に通してから出力
    //  ・音の出だしと終わりは必ず音量を0付近から/まで滑らかに変化させ、プチッというノイズを防ぐ
    //  ・同じ音は「同時に鳴らせる数」と「最短の再生間隔」を制限して、重なりすぎないようにする
    // =========================================================
    const sound = {
      ctx: null,         // AudioContext（最初のタッチ/キー入力で作る）
      master: null,      // マスター音量ノード
      noiseBuffer: null, // 風切り音などに使うホワイトノイズ
      enabled: true,     // ON/OFF
      voices: {},        // 効果音ごとの現在の同時再生数
      lastPlayed: {},    // 効果音ごとの最後に鳴らした時刻
    };
    const SE_MAX_VOICES = 3;      // 同じ効果音を同時に鳴らせる最大数
    const SE_MIN_INTERVAL = 0.03; // 同じ効果音を鳴らす最短間隔 [秒]

    // ON/OFF の設定はブラウザに保存しておく（保存できない環境でも動くよう try で囲む）
    try { sound.enabled = localStorage.getItem('bow-action-sound') !== 'off'; } catch (e) { /* 何もしない */ }

    // 音声を有効化する。スマホのブラウザはユーザー操作の中でしか音を鳴らし始められないため、
    // 最初のタッチ/クリック/キー入力のイベント内でこれを呼ぶ
    function unlockAudio() {
      if (!sound.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return; // Web Audio 非対応ブラウザでは音なしで遊べるようにする
        const ctx = new AudioCtx();
        sound.ctx = ctx;

        // マスター音量 → コンプレッサー → スピーカー
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -12;
        compressor.knee.value = 6;
        compressor.ratio.value = 12;
        compressor.attack.value = 0.002;
        compressor.release.value = 0.1;
        compressor.connect(ctx.destination);
        sound.master = ctx.createGain();
        sound.master.gain.value = SE_MASTER_VOLUME;
        sound.master.connect(compressor);

        // 0.5秒ぶんのホワイトノイズを作っておき、使い回す
        const length = Math.floor(ctx.sampleRate * 0.5);
        sound.noiseBuffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = sound.noiseBuffer.getChannelData(0);
        for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;

        // iOS Safari 対策：無音を一瞬鳴らしておくと、以降の再生が確実に許可される
        const silent = ctx.createBufferSource();
        silent.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        silent.connect(ctx.destination);
        silent.start();
      }
      if (sound.ctx.state === 'suspended') sound.ctx.resume();
    }
    // 最初の操作で有効化。capture: true でボタンやキャンバスより先に受け取る
    for (const type of ['pointerdown', 'touchend', 'keydown', 'click']) {
      window.addEventListener(type, unlockAudio, { capture: true, passive: true });
    }

    // 音量の包絡線（エンベロープ）付きのゲインノードを作る
    // attack 秒で peak まで上げ、duration 秒かけて0付近まで下げる
    function envelope(ctx, t, peak, attack, duration) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      return g;
    }

    // 発振器（ピッチを from → to へ duration 秒で変化させる）
    function sweepOsc(ctx, type, t, from, to, duration) {
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(to, t + duration);
      return osc;
    }

    // ノイズ音源
    function noiseSource(ctx) {
      const src = ctx.createBufferSource();
      src.buffer = sound.noiseBuffer;
      return src;
    }

    // 効果音ごとの合成レシピ。out（出力先）に繋ぎ、鳴らした音源の配列と長さを返す
    const SE_RECIPES = {
      // ヒュッ：ノイズをバンドパスフィルタに通し、中心周波数を高→低へ素早く動かす
      shoot(ctx, t, out) {
        const src = noiseSource(ctx);
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 2.5;
        filter.frequency.setValueAtTime(4000, t);
        filter.frequency.exponentialRampToValueAtTime(900, t + 0.14);
        const env = envelope(ctx, t, 3.0, 0.01, 0.16); // フィルタで音が細くなるぶん大きめに
        src.connect(filter).connect(env).connect(out);
        src.start(t);
        src.stop(t + 0.17);
        return [src];
      },
      // トッ：低めの三角波を一瞬で下げる＋ごく短いノイズのアタック
      hit(ctx, t, out) {
        const osc = sweepOsc(ctx, 'triangle', t, 320, 110, 0.07);
        const env = envelope(ctx, t, 1.4, 0.002, 0.09);
        osc.connect(env).connect(out);
        osc.start(t);
        osc.stop(t + 0.1);

        const click = noiseSource(ctx);
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 1500;
        const clickEnv = envelope(ctx, t, 0.5, 0.001, 0.025);
        click.connect(hp).connect(clickEnv).connect(out);
        click.start(t);
        click.stop(t + 0.03);
        return [osc, click];
      },
      // ポンッ：高めのサイン波を下げつつ、短いノイズの破裂感を重ねる
      destroy(ctx, t, out) {
        const osc = sweepOsc(ctx, 'sine', t, 1100, 380, 0.14);
        const env = envelope(ctx, t, 1.4, 0.003, 0.18);
        osc.connect(env).connect(out);
        osc.start(t);
        osc.stop(t + 0.19);

        const burst = noiseSource(ctx);
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 2500;
        bp.Q.value = 0.8;
        const burstEnv = envelope(ctx, t, 0.6, 0.001, 0.06);
        burst.connect(bp).connect(burstEnv).connect(out);
        burst.start(t);
        burst.stop(t + 0.07);
        return [osc, burst];
      },
      // ピョン：矩形波のピッチを低→高へ持ち上げる（ローパスで角を丸めて軽い音に）
      jump(ctx, t, out) {
        const osc = sweepOsc(ctx, 'square', t, 280, 760, 0.12);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 2200;
        const env = envelope(ctx, t, 1.5, 0.005, 0.15);
        osc.connect(lp).connect(env).connect(out);
        osc.start(t);
        osc.stop(t + 0.16);
        return [osc];
      },
      // トン：低いサイン波を短く下げる
      land(ctx, t, out) {
        const osc = sweepOsc(ctx, 'sine', t, 150, 55, 0.09);
        const env = envelope(ctx, t, 1.6, 0.003, 0.11);
        osc.connect(env).connect(out);
        osc.start(t);
        osc.stop(t + 0.12);
        return [osc];
      },
      // キンッ：倍音関係にない高い2音を重ねて金属っぽくし、すっと減衰させる
      reflect(ctx, t, out) {
        const sources = [];
        for (const [freq, peak] of [[2600, 0.9], [3900, 0.5], [5300, 0.25]]) {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          const env = envelope(ctx, t, peak, 0.002, 0.35);
          osc.connect(env).connect(out);
          osc.start(t);
          osc.stop(t + 0.36);
          sources.push(osc);
        }
        // 当たった瞬間の「カッ」というアタック
        const click = noiseSource(ctx);
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 4000;
        const clickEnv = envelope(ctx, t, 0.6, 0.001, 0.02);
        click.connect(hp).connect(clickEnv).connect(out);
        click.start(t);
        click.stop(t + 0.03);
        sources.push(click);
        return sources;
      },
    };

    // 効果音を鳴らす
    function playSound(name) {
      const ctx = sound.ctx;
      if (!sound.enabled || !ctx || ctx.state !== 'running') return;

      // 同じ音の鳴らしすぎを防ぐ（短すぎる間隔・同時再生数オーバーなら鳴らさない）
      const now = ctx.currentTime;
      if (now - (sound.lastPlayed[name] ?? -1) < SE_MIN_INTERVAL) return;
      if ((sound.voices[name] ?? 0) >= SE_MAX_VOICES) return;
      sound.lastPlayed[name] = now;

      // 効果音ごとの音量ノードを挟んでマスターへ繋ぐ
      const out = ctx.createGain();
      out.gain.value = SE_VOLUMES[name] ?? 1;
      out.connect(sound.master);
      const sources = SE_RECIPES[name](ctx, now, out);

      // 再生が全部終わったら同時再生数を戻し、ノードを切り離す
      sound.voices[name] = (sound.voices[name] ?? 0) + 1;
      let remaining = sources.length;
      for (const src of sources) {
        src.onended = () => {
          if (--remaining > 0) return;
          sound.voices[name]--;
          out.disconnect();
        };
      }
    }

    // =========================================================
    // レンダラー・シーン・カメラの初期化
    // =========================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    // スマホの高解像度画面で重くなりすぎないよう、ピクセル比は最大2に制限
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a9c9);
    scene.fog = new THREE.Fog(0x87a9c9, 30, 80);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);

    // ライト：全体を照らす半球光 ＋ 影を落とす平行光
    scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(10, 20, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    scene.add(sun);

    // =========================================================
    // ステージ（地面と段差の箱）
    // 当たり判定は全て「軸に平行な箱（AABB）」で管理する
    // =========================================================
    const colliders = []; // { min: Vector3, max: Vector3 } の配列

    // 箱を作ってシーンと当たり判定リストの両方に登録する関数
    // x, z は箱の中心、y は箱の底面の高さ
    function addBox(x, y, z, w, h, d, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color })
      );
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      colliders.push({
        min: new THREE.Vector3(x - w / 2, y, z - d / 2),
        max: new THREE.Vector3(x + w / 2, y + h, z + d / 2),
      });
      return mesh;
    }

    // 地面：灰色の大きな板（上面が y=0 になるよう、厚みぶん下にずらす）
    addBox(0, -1, 0, STAGE_HALF * 2, 1, STAGE_HALF * 2, 0x888888);

    // 段差になる箱を3つ（低い→中くらい→高いの順で階段状に登れる配置）
    addBox(-4, 0, 6, 4, 0.3, 4, 0xb0b0b0);  // 低い段差：歩くだけで乗れる
    addBox(0, 0, 10, 4, 1.2, 4, 0xa0a0a0);  // 中くらい：ジャンプで乗る
    addBox(4, 0, 14, 4, 2.4, 4, 0x909090);  // 高い：中くらいの箱からジャンプで乗る

    // =========================================================
    // 鏡（水色の薄い板）
    // 鏡は斜めに置けるので、軸に平行な箱（AABB）の colliders には入れず、
    // 「鏡の中心・面の向き（normal）・横方向（right）」を持つ回転した箱として別に扱う。
    // 当たり判定は鏡のローカル座標（right, 上, normal）に変換して行う。
    // =========================================================
    const MIRROR_HALF = new THREE.Vector3(MIRROR_WIDTH / 2, MIRROR_HEIGHT / 2, MIRROR_THICKNESS / 2);
    const mirrorMaterial = new THREE.MeshStandardMaterial({
      color: 0x8fe3ff,
      emissive: 0x3fb6e0,       // 少し光らせる
      emissiveIntensity: 0.5,
      metalness: 0.3,
      roughness: 0.2,
    });
    const mirrorGeometry = new THREE.BoxGeometry(MIRROR_WIDTH, MIRROR_HEIGHT, MIRROR_THICKNESS);
    const mirrors = MIRRORS.map(({ x, y, z, yaw }) => {
      const rad = THREE.MathUtils.degToRad(yaw);
      const mesh = new THREE.Mesh(mirrorGeometry, mirrorMaterial);
      mesh.position.set(x, y + MIRROR_HEIGHT / 2, z);
      mesh.rotation.y = rad;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return {
        center: mesh.position.clone(),
        normal: new THREE.Vector3(Math.sin(rad), 0, Math.cos(rad)), // 鏡の面の向き（ローカル +Z）
        right: new THREE.Vector3(Math.cos(rad), 0, -Math.sin(rad)), // 鏡の横方向（ローカル +X）
        localBox: { min: MIRROR_HALF.clone().negate(), max: MIRROR_HALF.clone() },
      };
    });

    // ワールド座標の点・方向を、鏡のローカル座標（x: 横, y: 上, z: 面の向き）に変換する
    function toMirrorLocal(mirror, v, out, isDirection = false) {
      const dx = v.x - (isDirection ? 0 : mirror.center.x);
      const dy = v.y - (isDirection ? 0 : mirror.center.y);
      const dz = v.z - (isDirection ? 0 : mirror.center.z);
      return out.set(
        dx * mirror.right.x + dz * mirror.right.z,
        dy,
        dx * mirror.normal.x + dz * mirror.normal.z
      );
    }

    // =========================================================
    // 的（赤い1m四方の箱）。矢は的を貫通する
    // 生きている間は当たり判定リスト colliders にも登録し、プレイヤーが乗ったりぶつかったりできる。
    // collider.target に的自身を入れておき、矢が当たったときに「的か壁か」を見分ける。
    // =========================================================
    const TARGET_SIZE = 1.0;
    // 的の配置はファイル上部の TARGET_SPOTS で決める
    const targetGeometry = new THREE.BoxGeometry(TARGET_SIZE, TARGET_SIZE, TARGET_SIZE);
    const targets = TARGET_SPOTS.map(([x, y, z]) => {
      // 被弾時に個別に光らせるため、マテリアルは的ごとに作る
      const mesh = new THREE.Mesh(targetGeometry, new THREE.MeshStandardMaterial({ color: 0xd83030 }));
      mesh.position.set(x, y + TARGET_SIZE / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      const h = TARGET_SIZE / 2;
      const target = {
        mesh,
        hp: TARGET_HP,
        state: 'alive',   // 'alive'（生存）→ 'dying'（縮んでいる途中）→ 'dead'（消えた）
        flashTimer: 0,    // 白く光っている残り時間
        shrinkTimer: 0,   // 縮み終わるまでの残り時間
        collider: {
          min: new THREE.Vector3(x - h, y, z - h),
          max: new THREE.Vector3(x + h, y + TARGET_SIZE, z + h),
        },
      };
      target.collider.target = target;
      colliders.push(target.collider);
      return target;
    });
    let targetRespawnTimer = 0; // 全滅後、復活までの残り時間（0なら待機していない）

    // 矢が的に当たったときの処理
    function damageTarget(target) {
      target.hp -= 1;
      target.flashTimer = TARGET_FLASH_TIME;
      // 倒したときは「ポンッ」、まだ残っているときは「トッ」
      playSound(target.hp <= 0 ? 'destroy' : 'hit');
      if (target.hp <= 0) {
        target.state = 'dying';
        target.shrinkTimer = TARGET_SHRINK_TIME;
        // 縮み始めた時点で当たり判定から外す（もう矢もプレイヤーも当たらない）
        colliders.splice(colliders.indexOf(target.collider), 1);
      }
    }

    // 的を初期状態に戻す
    function resetTarget(target) {
      target.hp = TARGET_HP;
      target.state = 'alive';
      target.flashTimer = 0;
      target.mesh.scale.setScalar(1);
      target.mesh.visible = true;
      colliders.push(target.collider);
    }

    // 的の演出（光る・縮む）と、全滅時の復活を更新する
    function updateTargets(dt) {
      for (const t of targets) {
        // 被弾直後は自己発光を白にして光らせる
        t.flashTimer = Math.max(0, t.flashTimer - dt);
        t.mesh.material.emissive.setHex(t.flashTimer > 0 ? 0xffffff : 0x000000);

        if (t.state === 'dying') {
          t.shrinkTimer -= dt;
          if (t.shrinkTimer <= 0) {
            t.state = 'dead';
            t.mesh.visible = false;
          } else {
            t.mesh.scale.setScalar(t.shrinkTimer / TARGET_SHRINK_TIME);
          }
        }
      }

      // 全部消えたら一定時間後にまとめて復活させる
      if (targetRespawnTimer > 0) {
        targetRespawnTimer -= dt;
        if (targetRespawnTimer <= 0) targets.forEach(resetTarget);
      } else if (targets.every((t) => t.state === 'dead')) {
        targetRespawnTimer = TARGET_RESPAWN_DELAY;
      }
    }

    // =========================================================
    // 主人公（青いカプセル）
    // player.position は「足元の中心」を表す
    // =========================================================
    const player = {
      position: new THREE.Vector3(0, 0, 0),
      velocity: new THREE.Vector3(),
      onGround: false,
      coyoteTimer: 0,     // 地面を離れてからの猶予タイマー
      jumpBufferTimer: 0, // ジャンプ入力の先行受付タイマー
      facing: 0,          // 向いている方向（Y軸回転、ラジアン）
    };
    const SPAWN_POINT = new THREE.Vector3(0, 0, 0);

    // 見た目用のグループ（足元基準で配置するため、カプセル本体は上にずらす）
    const playerMesh = new THREE.Group();
    const capsule = new THREE.Mesh(
      // CapsuleGeometry(半径, 円柱部分の長さ) → 全高 = 長さ + 半径*2
      new THREE.CapsuleGeometry(PLAYER_RADIUS, PLAYER_HEIGHT - PLAYER_RADIUS * 2, 8, 16),
      new THREE.MeshStandardMaterial({ color: 0x2f6fe0 })
    );
    capsule.position.y = PLAYER_HEIGHT / 2;
    capsule.castShadow = true;
    playerMesh.add(capsule);

    // 向きが分かるように、顔の位置に小さな箱を付ける
    const nose = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.2, 0.3),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    nose.position.set(0, PLAYER_HEIGHT * 0.75, PLAYER_RADIUS);
    playerMesh.add(nose);
    scene.add(playerMesh);

    // =========================================================
    // 入力（キーボード）
    // =========================================================
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        requestJump();
        e.preventDefault(); // スペースでページがスクロールしないように
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    // ウィンドウからフォーカスが外れたらキー状態をリセット（押しっぱなし防止）
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    // ジャンプ要求：すぐに跳ぶのではなく、バッファに入れて次の更新で判定する
    function requestJump() {
      player.jumpBufferTimer = JUMP_BUFFER;
    }

    // =========================================================
    // 入力（バーチャルスティック）
    // Pointer Events を使い、マルチタッチでも指ごとに管理する
    // =========================================================
    const stickEl = document.getElementById('stick');
    const knobEl = document.getElementById('stick-knob');
    const stick = { x: 0, y: 0, pointerId: null }; // x: 右が+、y: 上（前進）が+
    const STICK_RANGE = 50; // ノブが動ける最大距離 [px]

    function updateStick(e) {
      const rect = stickEl.getBoundingClientRect();
      let dx = e.clientX - (rect.left + rect.width / 2);
      let dy = e.clientY - (rect.top + rect.height / 2);
      const len = Math.hypot(dx, dy);
      // 円の外に出たら縁に押し戻す
      if (len > STICK_RANGE) {
        dx *= STICK_RANGE / len;
        dy *= STICK_RANGE / len;
      }
      knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
      stick.x = dx / STICK_RANGE;
      stick.y = -dy / STICK_RANGE; // 画面の上方向を前進にする
    }

    function resetStick() {
      stick.x = 0;
      stick.y = 0;
      stick.pointerId = null;
      knobEl.style.transform = '';
    }

    stickEl.addEventListener('pointerdown', (e) => {
      if (stick.pointerId !== null) return;
      stick.pointerId = e.pointerId;
      // 指がスティックの外に出ても追従し続けるようにキャプチャする
      stickEl.setPointerCapture(e.pointerId);
      updateStick(e);
      e.preventDefault();
    });
    stickEl.addEventListener('pointermove', (e) => {
      if (e.pointerId === stick.pointerId) updateStick(e);
    });
    const endStick = (e) => { if (e.pointerId === stick.pointerId) resetStick(); };
    stickEl.addEventListener('pointerup', endStick);
    stickEl.addEventListener('pointercancel', endStick);

    // =========================================================
    // 入力（ジャンプボタン）
    // =========================================================
    const jumpEl = document.getElementById('jump');
    jumpEl.addEventListener('pointerdown', (e) => {
      requestJump();
      jumpEl.classList.add('pressed');
      e.preventDefault();
    });
    const releaseJump = () => jumpEl.classList.remove('pressed');
    jumpEl.addEventListener('pointerup', releaseJump);
    jumpEl.addEventListener('pointercancel', releaseJump);
    jumpEl.addEventListener('pointerleave', releaseJump);

    // =========================================================
    // 矢
    // 細い円柱＋先端の円錐。+Z 方向が先端になるよう形状を回転させておき、
    // 発射時に「+Z を飛ぶ方向へ向ける回転」をかけて向きを合わせる。
    // =========================================================
    const ARROW_LENGTH = 0.8;
    const arrowShaftGeometry = new THREE.CylinderGeometry(0.03, 0.03, ARROW_LENGTH, 6);
    arrowShaftGeometry.rotateX(Math.PI / 2); // 円柱の軸を Y → Z に向ける
    const arrowTipGeometry = new THREE.ConeGeometry(0.07, 0.18, 8);
    arrowTipGeometry.rotateX(Math.PI / 2);   // 円錐の先端を +Z に向ける
    arrowTipGeometry.translate(0, 0, ARROW_LENGTH / 2 + 0.09);
    const arrowShaftMaterial = new THREE.MeshStandardMaterial({ color: 0x8a6a40 });
    const arrowTipMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd });

    const arrows = [];      // 飛んでいる矢 { mesh, dir, life, reflections, hitTargets }
    let shootCooldown = 0;  // 次に撃てるまでの残り時間

    // 今撃ったら矢がどう飛び出すかを計算する（予測線と実際の射撃で共通）
    // 戻り値：{ aim: 照準の情報, dir: 飛ぶ向き, position: 矢の中心の初期位置, tip: 矢の先端の初期位置 }
    function computeShot() {
      // 胸の高さから、照準の先（またはエイムアシストで選んだ的）へ向けて撃つ
      const aim = computeAim();
      const origin = player.position.clone();
      origin.y += ARROW_HEIGHT;
      const dir = (aim.target ? aim.target.mesh.position : aim.point).clone().sub(origin);
      // 狙う地点が近すぎる（足元などを狙った）ときは、向きが不安定になるのでカメラの視線方向へ撃つ
      if (dir.length() < 1.5) dir.copy(aim.rayDir);
      dir.normalize();
      // 体の表面あたりから撃ち出す（中心から出すと見た目がめり込むため）
      const position = origin.addScaledVector(dir, PLAYER_RADIUS);
      const tip = position.clone().addScaledVector(dir, ARROW_TIP_OFFSET);
      return { aim, dir, position, tip };
    }

    // 矢を1本撃つ（クールダウン中なら何もしない）
    function shoot() {
      if (shootCooldown > 0) return;
      shootCooldown = SHOOT_COOLDOWN;
      playSound('shoot');

      const { dir, position, tip } = computeShot();
      // プレイヤーの体も即座に撃つ方向（水平成分）へ向ける
      player.facing = Math.atan2(dir.x, dir.z);

      const mesh = new THREE.Group();
      mesh.add(new THREE.Mesh(arrowShaftGeometry, arrowShaftMaterial));
      mesh.add(new THREE.Mesh(arrowTipGeometry, arrowTipMaterial));
      mesh.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);
      mesh.position.copy(position);
      scene.add(mesh);
      arrows.push({
        mesh,
        dir,
        life: ARROW_LIFETIME,
        reflections: 0,        // 鏡で反射した回数
        hitTargets: new Set(), // この矢がすでに抜いた的（同じ的に2回当たらないように）
        trail: createTrail(tip), // 光の尾
        sinceCorner: 0,        // 発射・最後の反射から進んだ距離（尾の描き方に使う）
      });
    }
    const ARROW_FORWARD = new THREE.Vector3(0, 0, 1); // 矢のモデルの先端方向

    // =========================================================
    // 照準とエイムアシスト
    // =========================================================
    const crosshairEl = document.getElementById('crosshair');
    crosshairEl.style.top = `${(0.5 - CROSSHAIR_RAISE) * 100}%`;
    // 照準の位置をカメラの画面座標（-1〜1、上が+）で表したもの
    const CROSSHAIR_NDC = new THREE.Vector2(0, CROSSHAIR_RAISE * 2);
    const aimRaycaster = new THREE.Raycaster();
    const AIM_ASSIST_COS = Math.cos(THREE.MathUtils.degToRad(AIM_ASSIST_ANGLE));

    // レイ（origin から dir 方向）と箱の交差判定（スラブ法）。
    // tMin〜tMax の範囲で当たれば、その距離を返す。当たらなければ null
    function rayBox(origin, dir, box, tMin, tMax) {
      for (const axis of ['x', 'y', 'z']) {
        const o = origin[axis], d = dir[axis];
        if (Math.abs(d) < 1e-9) {
          // この軸に平行なレイ：箱の範囲外なら当たらない
          if (o < box.min[axis] || o > box.max[axis]) return null;
          continue;
        }
        let t1 = (box.min[axis] - o) / d;
        let t2 = (box.max[axis] - o) / d;
        if (t1 > t2) [t1, t2] = [t2, t1];
        tMin = Math.max(tMin, t1);
        tMax = Math.min(tMax, t2);
        if (tMin > tMax) return null;
      }
      return tMin;
    }

    // レイと鏡（回転した箱）の交差判定。鏡のローカル座標に変換してから箱と同じ方法で調べる
    const localOrigin = new THREE.Vector3();
    const localDir = new THREE.Vector3();
    function rayMirror(origin, dir, mirror, tMin, tMax) {
      toMirrorLocal(mirror, origin, localOrigin);
      toMirrorLocal(mirror, dir, localDir, true);
      return rayBox(localOrigin, localDir, mirror.localBox, tMin, tMax);
    }

    // レイが最初に当たる物（地形・的・鏡）を探す。鏡に当たったときは mirror が入る
    // skipTargets を true にすると的を無視する（矢は的を貫通するので、軌道の計算ではこちらを使う）
    function raycastColliders(origin, dir, tMin, tMax, ignore = null, skipTargets = false) {
      let best = null;
      for (const box of colliders) {
        if (box === ignore || (skipTargets && box.target)) continue;
        const t = rayBox(origin, dir, box, tMin, best ? best.t : tMax);
        if (t !== null) best = { box, t };
      }
      for (const mirror of mirrors) {
        const t = rayMirror(origin, dir, mirror, tMin, best ? best.t : tMax);
        if (t !== null) best = { mirror, t };
      }
      return best;
    }

    // 今の照準で「どこを狙っているか」を計算する
    // 戻り値：{ point: 照準の先の地点, rayDir: カメラの視線方向, onTarget: 照準に重なっている的, target: アシストで狙う的 }
    function computeAim() {
      camera.updateMatrixWorld(); // 描画前でも最新のカメラ位置・向きで計算する
      aimRaycaster.setFromCamera(CROSSHAIR_NDC, camera);
      const camPos = aimRaycaster.ray.origin;
      const rayDir = aimRaycaster.ray.direction;

      // カメラとプレイヤーの間にある物は無視したいので、
      // 「レイ上でプレイヤーの胸に一番近い点」から先だけを調べる
      const chest = player.position.clone();
      chest.y += ARROW_HEIGHT;
      const tStart = Math.max(0, chest.sub(camPos).dot(rayDir));

      const hit = raycastColliders(camPos, rayDir, tStart, AIM_FAR_DISTANCE);
      const point = camPos.clone().addScaledVector(rayDir, hit ? hit.t : AIM_FAR_DISTANCE);
      const onTarget = hit && hit.box && hit.box.target ? hit.box.target : null;

      // エイムアシスト：照準に重なっている的があればそれを優先。
      // なければ、照準から AIM_ASSIST_ANGLE 度以内で一番近い角度の的を選ぶ
      let target = onTarget;
      if (!target && AIM_ASSIST_ANGLE > 0) {
        let bestCos = AIM_ASSIST_COS;
        const toTarget = new THREE.Vector3();
        const origin = player.position.clone();
        origin.y += ARROW_HEIGHT;
        for (const t of targets) {
          if (t.state !== 'alive') continue;
          toTarget.copy(t.mesh.position).sub(camPos);
          const along = toTarget.dot(rayDir);
          if (along <= tStart) continue; // プレイヤーより手前（カメラ側）の的は対象外
          const cos = along / toTarget.length();
          if (cos < bestCos) continue;
          // 遮蔽物チェック：矢の発射位置から的の中心まで、他の箱や鏡に遮られていないか
          const path = t.mesh.position.clone().sub(origin);
          const dist = path.length();
          path.divideScalar(dist);
          if (raycastColliders(origin, path, 0, dist, t.collider)) continue;
          bestCos = cos;
          target = t;
        }
      }
      return { point, rayDir: rayDir.clone(), onTarget, target };
    }

    // 点が箱の中に入っているか
    function pointInBox(p, box) {
      return p.x >= box.min.x && p.x <= box.max.x &&
             p.y >= box.min.y && p.y <= box.max.y &&
             p.z >= box.min.z && p.z <= box.max.z;
    }

    // 矢の中心から先端までの距離
    const ARROW_TIP_OFFSET = ARROW_LENGTH / 2 + 0.18;

    // 矢の先端が、このフレームで鏡に当たったかを調べる。
    // prevTip → tip の線分と鏡の交差を求め、一番手前で当たった鏡を返す
    const segmentDir = new THREE.Vector3();
    const hitLocal = new THREE.Vector3();
    function findMirrorHit(prevTip, tip) {
      segmentDir.subVectors(tip, prevTip);
      const length = segmentDir.length();
      if (length < 1e-9) return null;
      segmentDir.divideScalar(length);
      let best = null;
      for (const mirror of mirrors) {
        const t = rayMirror(prevTip, segmentDir, mirror, 0, best ? best.t : length);
        if (t === null) continue;
        // 当たった点が鏡の「面」（表か裏）なら反射、「縁」（側面・上下）なら壁と同じ扱い
        const point = prevTip.clone().addScaledVector(segmentDir, t);
        toMirrorLocal(mirror, point, hitLocal);
        const onFace = Math.abs(Math.abs(hitLocal.z) - MIRROR_HALF.z) < 1e-4;
        best = { mirror, t, point, onFace, remaining: length - t };
      }
      return best;
    }

    // 矢を消す。1つ以上の的を抜いていたら「×N HIT!」を表示する。光の尾は薄くしながら消していく
    function removeArrow(index) {
      const a = arrows[index];
      scene.remove(a.mesh);
      arrows.splice(index, 1);
      fadingTrails.push({ trail: a.trail, time: TRAIL_FADE_TIME });
      if (a.hitTargets.size > 0) showHitCount(a.hitTargets.size);
    }

    // 点がマップの外（地面の範囲外、または高すぎる）にあるか
    function isOutsideStage(p) {
      return Math.abs(p.x) > STAGE_HALF || Math.abs(p.z) > STAGE_HALF || p.y > STAGE_CEILING;
    }

    // =========================================================
    // 光の尾（矢の軌跡）
    // 発射位置 → 反射した点 → … → 今の矢の後ろ、を結ぶ折れ線として描く。
    // 加算合成で光って見えるようにし、矢が消えたら1秒かけて薄くして消す。
    // =========================================================
    const TRAIL_MAX_POINTS = ARROW_MAX_REFLECTIONS + 2; // 発射位置＋反射点＋今の位置
    const fadingTrails = []; // 消えかけの尾 { trail, time }

    function createTrail(start) {
      const positions = new Float32Array(TRAIL_MAX_POINTS * 3);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({
        color: 0xffe9a0,
        transparent: true,
        opacity: TRAIL_OPACITY,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const line = new THREE.Line(geometry, material);
      line.frustumCulled = false; // 頂点を毎フレーム書き換えるので、画面外判定で消えないようにする
      scene.add(line);
      const trail = { line, positions, count: 1 };
      positions.set([start.x, start.y, start.z], 0);
      setTrailHead(trail, start);
      return trail;
    }

    // 折れ線の最後の点（今の矢の後ろ）を更新する
    function setTrailHead(trail, p) {
      trail.positions.set([p.x, p.y, p.z], trail.count * 3);
      trail.line.geometry.setDrawRange(0, trail.count + 1);
      trail.line.geometry.attributes.position.needsUpdate = true;
    }

    // 反射した点を折れ線の曲がり角として確定させる
    function addTrailCorner(trail, p) {
      if (trail.count + 1 >= TRAIL_MAX_POINTS) return;
      trail.positions.set([p.x, p.y, p.z], trail.count * 3);
      trail.count++;
      setTrailHead(trail, p);
    }

    // 消えかけの尾を薄くしていき、透明になったら取り除く
    function updateFadingTrails(dt) {
      for (let i = fadingTrails.length - 1; i >= 0; i--) {
        const f = fadingTrails[i];
        f.time -= dt;
        if (f.time > 0) {
          f.trail.line.material.opacity = TRAIL_OPACITY * (f.time / TRAIL_FADE_TIME);
          continue;
        }
        scene.remove(f.trail.line);
        f.trail.line.geometry.dispose();
        f.trail.line.material.dispose();
        fadingTrails.splice(i, 1);
      }
    }

    // 矢の移動・鏡での反射・命中判定
    const arrowTip = new THREE.Vector3();
    const prevTip = new THREE.Vector3();
    const trailHead = new THREE.Vector3();
    function updateArrows(dt) {
      shootCooldown = Math.max(0, shootCooldown - dt);

      for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        // 重力なしで、今の向きにまっすぐ進む
        prevTip.copy(a.mesh.position).addScaledVector(a.dir, ARROW_TIP_OFFSET);
        a.mesh.position.addScaledVector(a.dir, ARROW_SPEED * dt);
        arrowTip.copy(a.mesh.position).addScaledVector(a.dir, ARROW_TIP_OFFSET);
        a.life -= dt;
        a.sinceCorner += ARROW_SPEED * dt;

        // ---- 鏡 ----
        const mirrorHit = findMirrorHit(prevTip, arrowTip);
        if (mirrorHit) {
          // 鏡の縁に当たった、または反射回数の上限を超えたら消える
          if (!mirrorHit.onFace || a.reflections >= ARROW_MAX_REFLECTIONS) {
            removeArrow(i);
            continue;
          }
          // 反射：入射角＝反射角になるよう、面の向き（法線）成分だけを反転する
          //   r = d - 2 (d・n) n   （上下方向の成分もこの式でそのまま正しく扱われる）
          const n = mirrorHit.mirror.normal;
          a.dir.addScaledVector(n, -2 * a.dir.dot(n)).normalize();
          a.reflections++;
          playSound('reflect');
          // 鏡に当たった点から、このフレームで進み残した距離だけ新しい向きへ進める
          arrowTip.copy(mirrorHit.point).addScaledVector(a.dir, mirrorHit.remaining);
          a.mesh.position.copy(arrowTip).addScaledVector(a.dir, -ARROW_TIP_OFFSET);
          a.mesh.quaternion.setFromUnitVectors(ARROW_FORWARD, a.dir);
          // 光の尾：反射した点を曲がり角にする
          addTrailCorner(a.trail, mirrorHit.point);
          a.sinceCorner = mirrorHit.remaining;
        }

        // 光の尾の先端は矢の後ろ端に合わせる（反射直後は曲がり角より手前に戻らないようにする）
        trailHead.copy(arrowTip).addScaledVector(a.dir, -Math.min(a.sinceCorner, ARROW_TIP_OFFSET + ARROW_LENGTH / 2));
        setTrailHead(a.trail, trailHead);

        // ---- 的・地形 ----
        // 先端の位置で当たり判定（細かい時間刻みで更新しているので、すり抜けにくい）
        let hitWall = false;
        const newHits = [];
        for (const box of colliders) {
          if (!pointInBox(arrowTip, box)) continue;
          if (!box.target) { hitWall = true; continue; } // 地面・段差・壁
          // 的は貫通する：まだ当たっていない的ならダメージを与え、矢はそのまま進む
          if (!a.hitTargets.has(box.target)) newHits.push(box.target);
        }
        // ダメージで的が消えると colliders から外れるので、ループを抜けてから与える
        for (const target of newHits) {
          a.hitTargets.add(target);
          damageTarget(target);
        }

        // 鏡以外に当たった、寿命が尽きた、またはマップの外へ出たら消す
        if (hitWall || a.life <= 0 || isOutsideStage(arrowTip)) removeArrow(i);
      }
    }

    // =========================================================
    // 撃つ前の予測線
    // 照準の方向へ撃ったときの軌道を、GUIDE_REFLECTIONS 回目の反射までと、
    // その反射直後の短い線（GUIDE_AFTER_LENGTH）だけ薄く表示する。
    // 的は貫通するので無視し、地面・段差・鏡の縁・マップの外で線を止める。
    // =========================================================
    const GUIDE_MAX_POINTS = GUIDE_REFLECTIONS + 2;
    const guidePositions = new Float32Array(GUIDE_MAX_POINTS * 3);
    const guideGeometry = new THREE.BufferGeometry();
    guideGeometry.setAttribute('position', new THREE.BufferAttribute(guidePositions, 3));
    const guideLine = new THREE.Line(guideGeometry, new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: GUIDE_OPACITY,
      depthWrite: false,
    }));
    guideLine.frustumCulled = false;
    scene.add(guideLine);

    // レイがマップの外へ出るまでの距離（マップの範囲を表す箱の出口）
    const stageBox = {
      min: new THREE.Vector3(-STAGE_HALF, -Infinity, -STAGE_HALF),
      max: new THREE.Vector3(STAGE_HALF, STAGE_CEILING, STAGE_HALF),
    };
    function distanceToStageExit(origin, dir) {
      let tExit = Infinity;
      for (const axis of ['x', 'y', 'z']) {
        const d = dir[axis];
        if (Math.abs(d) < 1e-9) continue;
        const bound = d > 0 ? stageBox.max[axis] : stageBox.min[axis];
        tExit = Math.min(tExit, (bound - origin[axis]) / d);
      }
      return Math.max(0, tExit);
    }

    // 予測線の頂点を計算して書き込む。shot は computeShot() の結果
    const guideHitLocal = new THREE.Vector3();
    function updateGuide(shot) {
      const pos = shot.tip.clone();
      const dir = shot.dir.clone();
      let count = 0;
      const push = (p) => { guidePositions.set([p.x, p.y, p.z], count * 3); count++; };
      push(pos);

      for (let reflections = 0; ; reflections++) {
        const maxDist = distanceToStageExit(pos, dir);
        const hit = raycastColliders(pos, dir, 1e-4, maxDist, null, true);
        if (!hit) { push(pos.addScaledVector(dir, maxDist)); break; } // マップの外まで何もない
        pos.addScaledVector(dir, hit.t);
        push(pos);
        if (!hit.mirror) break; // 地面・段差に当たったらそこで終わり

        // 鏡の縁なら矢はそこで消えるので、線もそこで終わり
        toMirrorLocal(hit.mirror, pos, guideHitLocal);
        if (Math.abs(Math.abs(guideHitLocal.z) - MIRROR_HALF.z) > 1e-4) break;
        if (reflections >= GUIDE_REFLECTIONS) break; // 見せる反射回数を使い切ったら終わり

        // 反射させる
        const n = hit.mirror.normal;
        dir.addScaledVector(n, -2 * dir.dot(n)).normalize();
        if (reflections + 1 >= GUIDE_REFLECTIONS) {
          // 最後に見せる反射：その直後の短い線だけ描く（途中で何かに当たればそこまで）
          const end = raycastColliders(pos, dir, 1e-4, GUIDE_AFTER_LENGTH, null, true);
          push(pos.clone().addScaledVector(dir, end ? end.t : GUIDE_AFTER_LENGTH));
          break;
        }
      }
      guideGeometry.setDrawRange(0, count);
      guideGeometry.attributes.position.needsUpdate = true;
    }

    // 「×N HIT!」を画面中央に1秒表示する
    const hitPopupEl = document.getElementById('hit-popup');
    function showHitCount(count) {
      hitPopupEl.textContent = `×${count} HIT!`;
      // アニメーションを最初からやり直すため、一度クラスを外して再計算させてから付け直す
      hitPopupEl.classList.remove('show');
      void hitPopupEl.offsetWidth;
      hitPopupEl.classList.add('show');
    }
    hitPopupEl.addEventListener('animationend', () => hitPopupEl.classList.remove('show'));

    // =========================================================
    // 入力（射撃）
    // スマホ：SHOOT ボタン／PC：マウス右クリック または F キー
    // （マウス左ドラッグは視点操作なので、射撃は右クリックに分けている）
    // =========================================================
    const shootEl = document.getElementById('shoot');
    shootEl.addEventListener('pointerdown', (e) => {
      shoot();
      shootEl.classList.add('pressed');
      e.preventDefault();
    });
    const releaseShoot = () => shootEl.classList.remove('pressed');
    shootEl.addEventListener('pointerup', releaseShoot);
    shootEl.addEventListener('pointercancel', releaseShoot);
    shootEl.addEventListener('pointerleave', releaseShoot);

    window.addEventListener('keydown', (e) => {
      // キーの押しっぱなしによる自動リピートでは撃たない（1回押すごとに1本）
      if (e.code === 'KeyF' && !e.repeat) shoot();
    });
    // 右クリック。左ドラッグ中でも撃てるよう、pointerdown ではなく mousedown で拾う
    // （左ボタンを押したまま右ボタンを押しても pointerdown は発生しないため）
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 2) shoot();
    });

    // =========================================================
    // 効果音のON/OFFボタン（右上）
    // =========================================================
    const soundEl = document.getElementById('sound');
    const refreshSoundButton = () => { soundEl.textContent = sound.enabled ? '🔊' : '🔇'; };
    refreshSoundButton();
    soundEl.addEventListener('pointerdown', (e) => {
      sound.enabled = !sound.enabled;
      try { localStorage.setItem('bow-action-sound', sound.enabled ? 'on' : 'off'); } catch (err) { /* 何もしない */ }
      refreshSoundButton();
      e.preventDefault();
    });

    // 長押しメニューなどが出ないようにする
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // iOS Safari のピンチズーム・ダブルタップズームを止める（touch-action だけでは効かない場合の保険）
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', (e) => e.preventDefault());

    // =========================================================
    // 入力（視点ドラッグ）
    // スティックとJUMPボタン以外（＝キャンバス）をドラッグするとカメラが回る。
    // スティックとは別の指（pointerId）として扱うので、左手移動＋右手視点が同時にできる。
    // PCではマウスの左ドラッグで同じように回せる。
    // =========================================================
    let cameraYaw = 0;                    // カメラの水平角度（0のとき +Z 方向を向く）
    let cameraPitch = CAMERA_PITCH_INIT;  // カメラの上下角度
    let manualCameraTimer = 0;            // 手動操作後、自動回り込みを止めている残り時間
    const look = { pointerId: null, lastX: 0, lastY: 0 };
    const canvasEl = renderer.domElement;

    canvasEl.addEventListener('pointerdown', (e) => {
      if (look.pointerId !== null) return;          // 視点操作はひとつの指だけで行う
      if (e.pointerType === 'mouse' && e.button !== 0) return; // マウスは左ボタンのみ
      look.pointerId = e.pointerId;
      look.lastX = e.clientX;
      look.lastY = e.clientY;
      canvasEl.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    canvasEl.addEventListener('pointermove', (e) => {
      if (e.pointerId !== look.pointerId) return;
      const dx = e.clientX - look.lastX;
      const dy = e.clientY - look.lastY;
      look.lastX = e.clientX;
      look.lastY = e.clientY;
      if (dx === 0 && dy === 0) return;
      // 右へドラッグ → 視点が右を向く（yaw が減る方向が右回り）
      cameraYaw -= dx * CAMERA_YAW_SENSITIVITY;
      // 上へドラッグ → 見上げる（カメラが下がる）。反転設定にも対応
      cameraPitch += dy * CAMERA_PITCH_SENSITIVITY * (CAMERA_INVERT_Y ? -1 : 1);
      cameraPitch = THREE.MathUtils.clamp(cameraPitch, CAMERA_PITCH_MIN, CAMERA_PITCH_MAX);
      // 手動で回した直後は自動回り込みを止める
      manualCameraTimer = MANUAL_CAMERA_HOLD;
    });
    const endLook = (e) => { if (e.pointerId === look.pointerId) look.pointerId = null; };
    canvasEl.addEventListener('pointerup', endLook);
    canvasEl.addEventListener('pointercancel', endLook);
    canvasEl.addEventListener('lostpointercapture', endLook);

    // 入力をまとめて「-1〜1 の2次元ベクトル」として取得する
    function getMoveInput() {
      let x = 0, y = 0;
      if (keys['KeyW'] || keys['ArrowUp']) y += 1;
      if (keys['KeyS'] || keys['ArrowDown']) y -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) x += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
      // キー入力が無ければスティックの値を使う
      if (x === 0 && y === 0) {
        x = stick.x;
        y = stick.y;
      }
      // 斜め入力で速くならないよう長さを1以下に制限
      const len = Math.hypot(x, y);
      if (len > 1) { x /= len; y /= len; }
      return { x, y };
    }

    // =========================================================
    // 当たり判定
    // 主人公は「円柱（半径 PLAYER_RADIUS、高さ PLAYER_HEIGHT）」として扱う
    // =========================================================

    // 主人公と箱が高さ方向で重なっているか
    function overlapsY(box, feetY) {
      const EPS = 0.001;
      return feetY < box.max.y - EPS && feetY + PLAYER_HEIGHT > box.min.y + EPS;
    }

    // XZ平面で、円（主人公）と矩形（箱の上から見た形）が重なっているか
    function overlapsXZ(box, px, pz, radius = PLAYER_RADIUS) {
      const cx = THREE.MathUtils.clamp(px, box.min.x, box.max.x);
      const cz = THREE.MathUtils.clamp(pz, box.min.z, box.max.z);
      const dx = px - cx, dz = pz - cz;
      return dx * dx + dz * dz < radius * radius;
    }

    // 水平方向の衝突解決：箱にめり込んでいたら押し出す（低い段差なら上に乗せる）
    function resolveHorizontal() {
      const p = player.position;
      for (const box of colliders) {
        if (!overlapsY(box, p.y)) continue;
        if (!overlapsXZ(box, p.x, p.z)) continue;

        // 低い段差は、接地中なら自動的に上に乗る（階段のような挙動）
        const stepUp = box.max.y - p.y;
        if (player.onGround && stepUp > 0 && stepUp <= STEP_HEIGHT && !hitsCeiling(box.max.y)) {
          p.y = box.max.y;
          continue;
        }

        // 円と矩形の最近接点から押し出し方向を求める
        const cx = THREE.MathUtils.clamp(p.x, box.min.x, box.max.x);
        const cz = THREE.MathUtils.clamp(p.z, box.min.z, box.max.z);
        let dx = p.x - cx, dz = p.z - cz;
        const dist = Math.hypot(dx, dz);
        if (dist > 1e-6) {
          // 円の中心が箱の外：最近接点から半径ぶん離す
          const push = PLAYER_RADIUS - dist;
          p.x += (dx / dist) * push;
          p.z += (dz / dist) * push;
        } else {
          // 円の中心が箱の内側に入ってしまった場合：一番近い面の方向へ押し出す
          const left = p.x - box.min.x, right = box.max.x - p.x;
          const back = p.z - box.min.z, front = box.max.z - p.z;
          const m = Math.min(left, right, back, front);
          if (m === left) p.x = box.min.x - PLAYER_RADIUS;
          else if (m === right) p.x = box.max.x + PLAYER_RADIUS;
          else if (m === back) p.z = box.min.z - PLAYER_RADIUS;
          else p.z = box.max.z + PLAYER_RADIUS;
        }
      }
    }

    // 鏡との衝突解決：鏡のローカル座標で「円と長方形」の押し出しを行い、ワールド座標に戻す
    const playerLocal = new THREE.Vector3();
    function resolveMirrors() {
      const p = player.position;
      for (const mirror of mirrors) {
        // 高さ方向で重なっていなければ無視
        const bottom = mirror.center.y - MIRROR_HALF.y;
        const top = mirror.center.y + MIRROR_HALF.y;
        if (p.y >= top || p.y + PLAYER_HEIGHT <= bottom) continue;

        toMirrorLocal(mirror, p, playerLocal);
        const cx = THREE.MathUtils.clamp(playerLocal.x, -MIRROR_HALF.x, MIRROR_HALF.x);
        const cz = THREE.MathUtils.clamp(playerLocal.z, -MIRROR_HALF.z, MIRROR_HALF.z);
        const dx = playerLocal.x - cx, dz = playerLocal.z - cz;
        const dist = Math.hypot(dx, dz);
        if (dist >= PLAYER_RADIUS) continue;

        let pushX, pushZ;
        if (dist > 1e-6) {
          // 円の中心が鏡の外：最近接点から半径ぶん離す
          pushX = (dx / dist) * (PLAYER_RADIUS - dist);
          pushZ = (dz / dist) * (PLAYER_RADIUS - dist);
        } else {
          // 円の中心が鏡の内側（薄いので通常は起きない）：面の向きに押し出す
          pushX = 0;
          pushZ = (playerLocal.z >= 0 ? 1 : -1) * (MIRROR_HALF.z + PLAYER_RADIUS) - playerLocal.z;
        }
        // ローカルの押し出し量をワールド座標に戻して適用
        p.x += mirror.right.x * pushX + mirror.normal.x * pushZ;
        p.z += mirror.right.z * pushX + mirror.normal.z * pushZ;
      }
    }

    // 段差に乗った先で頭がつかえないか（天井チェック）
    function hitsCeiling(newFeetY) {
      const p = player.position;
      for (const box of colliders) {
        if (overlapsY(box, newFeetY) && overlapsXZ(box, p.x, p.z)) return true;
      }
      return false;
    }

    // 垂直方向の移動と衝突解決：着地・頭ぶつけを判定する
    function moveVertical(dy) {
      const p = player.position;
      const prevY = p.y;
      const wasOnGround = player.onGround;
      p.y += dy;
      player.onGround = false;

      for (const box of colliders) {
        if (!overlapsXZ(box, p.x, p.z)) continue;

        if (dy <= 0) {
          // 落下中：前フレームで箱の上面より上にいて、今フレームで上面を下回った → 着地
          if (prevY >= box.max.y - 0.001 && p.y <= box.max.y) {
            p.y = box.max.y;
            // 空中からある程度の速さで着地したときだけ「トン」を鳴らす
            // （歩いて小さな段差を降りたときなどは鳴らさない）
            if (!wasOnGround && player.velocity.y < -LAND_SOUND_MIN_SPEED) playSound('land');
            player.velocity.y = 0;
            player.onGround = true;
          }
        } else {
          // 上昇中：頭が箱の底面を突き抜けた → 頭をぶつけて止まる
          const prevHead = prevY + PLAYER_HEIGHT;
          const head = p.y + PLAYER_HEIGHT;
          if (prevHead <= box.min.y + 0.001 && head > box.min.y) {
            p.y = box.min.y - PLAYER_HEIGHT;
            player.velocity.y = 0;
          }
        }
      }
    }

    // =========================================================
    // ゲームの更新処理
    // =========================================================
    function update(dt) {
      // ---- 入力をカメラ基準の移動方向に変換 ----
      // スティックの「上」は常にカメラが向いている方向になる
      const input = getMoveInput();
      // カメラの前方向と右方向（XZ平面上）
      const fx = Math.sin(cameraYaw), fz = Math.cos(cameraYaw);
      const rx = -Math.cos(cameraYaw), rz = Math.sin(cameraYaw);
      const moveX = fx * input.y + rx * input.x;
      const moveZ = fz * input.y + rz * input.x;
      const moveLen = Math.hypot(moveX, moveZ);

      player.velocity.x = moveX * MOVE_SPEED;
      player.velocity.z = moveZ * MOVE_SPEED;

      // 移動しているときは進行方向へ向きを滑らかに変える
      if (moveLen > 0.05) {
        const target = Math.atan2(moveX, moveZ);
        player.facing = lerpAngle(player.facing, target, 1 - Math.exp(-15 * dt));
      }

      // ---- ジャンプ判定（コヨーテタイム＋先行入力バッファ） ----
      player.coyoteTimer = player.onGround ? COYOTE_TIME : player.coyoteTimer - dt;
      player.jumpBufferTimer -= dt;
      if (player.jumpBufferTimer > 0 && player.coyoteTimer > 0) {
        player.velocity.y = JUMP_SPEED;
        player.onGround = false;
        playSound('jump');
        player.coyoteTimer = 0;
        player.jumpBufferTimer = 0;
      }

      // ---- 重力 ----
      player.velocity.y -= GRAVITY * dt;

      // ---- 移動と衝突解決（水平 → 垂直の順に処理） ----
      player.position.x += player.velocity.x * dt;
      player.position.z += player.velocity.z * dt;
      resolveHorizontal();
      resolveMirrors();
      moveVertical(player.velocity.y * dt);

      // ---- 落下したらスタート地点へ戻す ----
      if (player.position.y < FALL_LIMIT) {
        player.position.copy(SPAWN_POINT);
        player.velocity.set(0, 0, 0);
      }

      // ---- カメラの向きを主人公の背後へ徐々に回り込ませる ----
      // カメラ側（手前）へ歩いているときに回り込むとグルグル回ってしまうので除外
      // 手動で視点を回した直後（manualCameraTimer が残っている間）も回り込まない
      manualCameraTimer = Math.max(0, manualCameraTimer - dt);
      if (moveLen > 0.05 && manualCameraTimer <= 0) {
        const towardCamera = (moveX * fx + moveZ * fz) / moveLen < -0.5;
        if (!towardCamera) {
          cameraYaw = lerpAngle(cameraYaw, player.facing, 1 - Math.exp(-CAMERA_FOLLOW * moveLen * dt));
        }
      }
    }

    // 角度の補間（-π〜π をまたぐときに遠回りしないようにする）
    function lerpAngle(a, b, t) {
      let diff = b - a;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      return a + diff * t;
    }

    // =========================================================
    // 三人称カメラ：注視点のまわりを yaw / pitch で回る
    // 注視点（主人公の胸あたり）だけを滑らかに追従させ、角度は即座に反映する。
    // こうすると、主人公の動きはふんわり追いかけつつ、手動回転はキビキビ反応する。
    // =========================================================
    const cameraFocus = new THREE.Vector3(); // 実際に注視している点（滑らかに追従）
    const focusGoal = new THREE.Vector3();   // 注視点の目標（主人公の胸あたり）

    function updateCamera(dt, snap = false) {
      const p = player.position;
      focusGoal.set(p.x, p.y + PLAYER_HEIGHT * 0.6, p.z);
      if (snap) cameraFocus.copy(focusGoal);
      else cameraFocus.lerp(focusGoal, 1 - Math.exp(-CAMERA_SMOOTH * dt));

      // 注視点から「カメラの前方向の逆」へ、上下角度ぶん持ち上げた位置に置く
      const horizontal = Math.cos(cameraPitch) * CAMERA_DISTANCE;
      camera.position.set(
        cameraFocus.x - Math.sin(cameraYaw) * horizontal,
        cameraFocus.y + Math.sin(cameraPitch) * CAMERA_DISTANCE,
        cameraFocus.z - Math.cos(cameraYaw) * horizontal
      );
      // 地面にめり込まないよう最低の高さを保つ
      if (camera.position.y < CAMERA_MIN_Y) camera.position.y = CAMERA_MIN_Y;

      camera.lookAt(cameraFocus);
    }

    // =========================================================
    // メインループ
    // =========================================================
    const clock = new THREE.Clock();
    const MAX_SUBSTEP = 1 / 120; // 高速移動ですり抜けないよう、細かく分割して更新

    updateCamera(0, true);

    function loop() {
      // タブ復帰時などに巨大な dt が来ても暴れないよう上限を設ける
      const dt = Math.min(clock.getDelta(), 0.1);
      const steps = Math.ceil(dt / MAX_SUBSTEP);
      for (let i = 0; i < steps; i++) {
        update(dt / steps);
        updateArrows(dt / steps);
      }
      updateTargets(dt);
      shootEl.classList.toggle('cooling', shootCooldown > 0);

      // 見た目を物理状態に合わせる
      playerMesh.position.copy(player.position);
      playerMesh.rotation.y = player.facing;

      updateCamera(dt);
      // 照準が的に重なっていれば照準を赤くし、予測線を更新する
      const shot = computeShot();
      crosshairEl.classList.toggle('on-target', !!shot.aim.onTarget);
      updateGuide(shot);
      updateFadingTrails(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    loop();

    // 画面サイズ変更（スマホの回転含む）に対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
