      return record.time !== null && (than.time === null || record.time < than.time);
    }

    // タイム・記録の表示用の文字列
    const formatTime = (time) => (time === null ? '―' : `${time.toFixed(2)}秒`);
    const formatRecord = (record) => (record.time === null ? `${record.score}点` : `${record.score}点 / ${formatTime(record.time)}`);
    function refreshTitleBest() {
      const empty = best.score === 0 && best.time === null;
      document.getElementById('title-best').textContent = empty ? 'まだ記録なし' : formatRecord(best);
    }

    const titleScreenEl = document.getElementById('title-screen');
    const resultScreenEl = document.getElementById('result-screen');
    const countdownEl = document.getElementById('countdown');
    const hudArrowsEl = document.getElementById('hud-arrows');
    const hudTimeEl = document.getElementById('hud-time');
    const hudScoreEl = document.getElementById('hud-score');
    const hudAimEl = document.getElementById('hud-aim');

    // 上部の「位置 / 横 / 縦」を更新する（右が +、上が +。SOLUTION と同じ単位）
    const signed = (v, digits = 0) => `${v > 0 ? '+' : ''}${(v === 0 ? 0 : v).toFixed(digits)}`;
    function refreshAimHud() {
      hudAimEl.textContent = `位置 ${signed(-player.slotX + 0, 1)}m / 横 ${signed(-aimYawDeg + 0, 1)}° / 縦 ${signed(aimPitchDeg + 0, 1)}°`;
    }

    const allClearEl = document.getElementById('all-clear');

    // 状態を切り替え、それに合わせて画面の表示を変える
    function setState(state) {
      game.state = state;
      document.body.dataset.state = state; // CSS でぼかし・操作ボタンの表示を切り替える
      titleScreenEl.classList.toggle('show', state === 'title');
      resultScreenEl.classList.toggle('show', state === 'result');
      allClearEl.classList.toggle('show', state === 'allclear');
      guideLine.visible = state === 'playing';
      resetStick();
      look.pointerId = null;
    }

    // 上部の表示（残りの矢・残り時間・スコア）を更新する
    function refreshHud() {
      hudArrowsEl.textContent = game.arrowsLeft;
      hudTimeEl.textContent = Math.ceil(game.timeLeft);
      hudTimeEl.classList.toggle('warning', game.timeLeft <= WARNING_TIME);
      hudScoreEl.textContent = game.score;
    }

    // 風船を割ったときに点数を足す（hitIndex はその矢で何個目か）
    function addScore(points, hitIndex) {
      if (game.state !== 'playing') return;
      game.score += points;
      game.popped++;
      game.maxMulti = Math.max(game.maxMulti, hitIndex);
      // クリアタイム：最後に割った瞬間のゲーム内の経過時間（金色の風船の動きと同じ時計）を 0.01 秒単位で
      game.clearTime = Math.round(gameTime * 100) / 100;
      refreshHud();
      // 全部割ったら、残った矢1本につきボーナス。「ALL CLEAR!」を出し、少し待ってからリザルトへ
      if (game.popped >= balloons.length) {
        game.arrowBonus = game.arrowsLeft * ALL_CLEAR_ARROW_BONUS;
        game.score += game.arrowBonus;
        refreshHud();
        allClearEl.querySelector('.time').textContent = formatTime(game.clearTime);
        game.allClearTimer = ALL_CLEAR_SHOW_TIME;
        playSound('beepStart');
        setState('allclear');
      }
    }

    // 1ゲーム分の状態を完全に最初に戻す（風船の配置・動きの時間・矢・プレイヤーの位置と向き）
    function resetRound() {
      game.arrowsLeft = ARROW_COUNT;
      game.timeLeft = TIME_LIMIT;
      game.score = 0;
      game.popped = 0;
      game.maxMulti = 0;
      game.lastSecond = TIME_LIMIT;
      game.clearTime = null;
      game.arrowBonus = 0;
      // 飛んでいる矢と光の尾を消す（「×N HIT!」は出さない）
      for (const a of arrows) {
        scene.remove(a.mesh, a.trail.line);
        a.trail.line.geometry.dispose();
        a.trail.line.material.dispose();
      }
      arrows.length = 0;
      for (const f of fadingTrails) {
        scene.remove(f.trail.line);
        f.trail.line.geometry.dispose();
        f.trail.line.material.dispose();
      }
      fadingTrails.length = 0;
      hitPopupEl.classList.remove('show');
      // 風船を全部元に戻し、動きの時間も 0 に戻す（毎回まったく同じ動きから始まる）
      for (const balloon of balloons) {
        balloon.state = 'alive';
        balloon.group.visible = true;
      }
      balloonRespawnTimer = 0;
      gameTime = 0;
      // プレイヤーと狙いを正面に戻す
      player.slotX = 0;
      player.moveDir = 0;
      setAim(0, 0);
      shootCooldown = 0;
      updateCamera(0, true);
      refreshHud();
    }

    // スタート：カウントダウンを始める
    function startCountdown() {
      resetRound();
      game.countdownTime = 0;
      game.countdownStep = -1;
      setState('countdown');
    }

    // カウントダウンの文字を出す（毎回アニメーションを最初からやり直す）
    function showCountdown(text) {
      countdownEl.textContent = text;
      countdownEl.classList.remove('show');
      void countdownEl.offsetWidth;
      countdownEl.classList.add('show');
    }
    countdownEl.addEventListener('animationend', () => countdownEl.classList.remove('show'));

    // ゲーム終了：リザルト画面を出し、自分のベストを更新する
    function endGame() {
      // 時間切れのときに飛んでいた矢は消す（点数には入れない）
      for (const a of arrows) {
        scene.remove(a.mesh);
        fadingTrails.push({ trail: a.trail, time: TRAIL_FADE_TIME });
      }
      arrows.length = 0;

      // スコアが高ければ、同点ならタイムが速ければ NEW RECORD!
      const record = { score: game.score, time: game.clearTime };
      const isNewRecord = isBetter(record, best);
      if (isNewRecord) {
        best = record;
        saveBest(best);
      }
      document.getElementById('result-score').firstChild.textContent = game.score;
      document.querySelector('#result-time span').textContent = formatTime(game.clearTime);
      document.getElementById('result-popped').textContent = `${game.popped}個`;
      document.getElementById('result-multi').textContent = `×${game.maxMulti}`;
      // 残り矢ボーナスは全部割ったときだけ表示する
      document.getElementById('result-arrow-bonus').textContent = `+${game.arrowBonus}`;
      document.querySelectorAll('.arrow-bonus').forEach((el) => { el.style.display = game.popped >= balloons.length ? '' : 'none'; });
      document.getElementById('result-best').textContent = formatRecord(best);
      document.getElementById('new-record').classList.toggle('show', isNewRecord);
      refreshTitleBest();
      setState('result');
    }

    // 状態ごとの毎フレームの処理
    const COUNTDOWN_TEXTS = ['3', '2', '1', 'スタート！'];
    function updateGame(dt) {
      if (game.state === 'countdown') {
        game.countdownTime += dt;
        const step = Math.floor(game.countdownTime / COUNTDOWN_STEP);
        if (step !== game.countdownStep) {
          game.countdownStep = step;
          showCountdown(COUNTDOWN_TEXTS[step]);
          // 「スタート！」が出た瞬間からゲーム開始
          if (step >= 3) {
            playSound('beepStart');
            setState('playing');
          } else {
            playSound('beep');
          }
        }
        return;
      }

      if (game.state === 'playing') {
        game.timeLeft = Math.max(0, game.timeLeft - dt);
        // 残り時間わずか：秒が変わるたびに「ピッ」
        const second = Math.ceil(game.timeLeft);
        if (second !== game.lastSecond) {
          game.lastSecond = second;
          if (second <= WARNING_TIME && second > 0) playSound('beep');
        }
        refreshHud();
        // 時間切れ、または矢を全部撃ち終えて最後の矢が消えたら終了
        if (game.timeLeft <= 0 || (game.arrowsLeft === 0 && arrows.length === 0)) endGame();
      }

      // 全部割った直後：「ALL CLEAR!」を少し見せてからリザルトへ（時間は止まる）
      if (game.state === 'allclear') {
        game.allClearTimer -= dt;
        if (game.allClearTimer <= 0) endGame();
      }
    }

    document.getElementById('start-btn').addEventListener('click', startCountdown);
    document.getElementById('retry-btn').addEventListener('click', startCountdown);
    document.getElementById('to-title-btn').addEventListener('click', () => setState('title'));
    refreshTitleBest();

    // =========================================================
    // メインループ
    // =========================================================
    const clock = new THREE.Clock();
    const MAX_SUBSTEP = 1 / 120; // 高速移動ですり抜けないよう、細かく分割して更新

    updateCamera(0, true);
    advanceBalloonTime(0);
    setAim(0, 0);
    setState('title');
    // 確認用：ブラウザのコンソールから simulateShots(SOLUTION) で満点ルートを試せる（画面には出さない）
    window.mirrorShooting = { simulateShots, SOLUTION };

    // FPS 表示（0.5秒ごとに、その間の平均を出す）
    const fpsEl = document.getElementById('fps');
    fpsEl.hidden = !SHOW_FPS;
    let fpsFrames = 0, fpsTime = 0;
    function updateFps(rawDt) {
      if (!SHOW_FPS) return;
      fpsFrames++;
      fpsTime += rawDt;
      if (fpsTime < 0.5) return;
      fpsEl.textContent = `${Math.round(fpsFrames / fpsTime)} FPS`;
      fpsFrames = 0;
      fpsTime = 0;
    }

    function loop() {
      const rawDt = clock.getDelta();
      updateFps(rawDt);
      // タブ復帰時などに巨大な dt が来ても暴れないよう上限を設ける
      const dt = Math.min(rawDt, 0.1);
      const steps = Math.ceil(dt / MAX_SUBSTEP);
      for (let i = 0; i < steps; i++) {
        // カウントダウン中は風船の動きを止めておき、「スタート！」から動きの時間を進める。
        // 矢の当たり判定は、刻みごとにその時刻の風船の位置で行う
        advanceBalloonTime(game.state === 'countdown' ? 0 : dt / steps);
        if (game.state === 'playing') update(dt / steps); // プレイヤーが動けるのはゲーム中だけ
        updateArrows(dt / steps);
      }
      updateBalloons(dt);
      updateGame(dt);
      shootEl.classList.toggle('cooling', shootCooldown > 0 || game.arrowsLeft <= 0);

      // 見た目を物理状態に合わせる
      playerMesh.position.copy(player.position);
      playerMesh.rotation.y = player.facing;

      updateCamera(dt);
      // ゲーム中は予測線を更新し、照準を「矢が最初に当たる地点」に置く。
      // そこまでの間に風船があれば照準を赤くする
      if (game.state === 'playing' || game.state === 'countdown') {
        const aim = updateGuide(currentShot());
        placeCrosshair(aim.firstHit);
        crosshairEl.classList.toggle('on-target', aim.onTarget);
      }
      updateFadingTrails(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    loop();

    // 画面サイズ変更（スマホの回転含む）に対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
